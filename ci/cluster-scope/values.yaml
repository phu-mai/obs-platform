# ---------------------------------------------
prometheusAzureMetricsExporter:
  enabled: false

prometheus-azure-metrics-exporter:
  fullnameOverride: prometheus-azure-metrics-exporter

  service:
    type: ClusterIP
    port: 8080

  extraEnv:
    - name: AZURE_CLIENT_ID
      value: "azure_client_id"
    - name: AZURE_TENANT_ID
      value: "azure_tenant_id"
    - name: AZURE_CLIENT_SECRET
      value: "azure_client_secret"
    - name: AZURE_SUBSCRIPTION_ID
      value: "azure_subscription_id"

  resources:
    requests:
      cpu: 1m
      memory: 1Mi
    limits:
      cpu: 1000m
      memory: 3Gi

  podMonitor:
    podMetricsEndpoints:
      services:
        azureMetricsPostgresFlexible:
          enabled: false
        azureMetricsEventHub:
          enabled: false
        azureMetricsCacheRedis:
          enabled: false
        azureMetricsCosmoMongodb:
          enabled: false
        azureFrontdoor:
          enabled: true
# ---------------------------------------------
kubePrometheusStack:
  enabled: true
# ---------------------------------------------
kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack

  whatsappMonitor:
    enabled: true
    staticTargets: []

  mimirRemoteWrite:
    enabled: true

  defaultRules:
    disabled:
      KubePersistentVolumeFillingUp: true
      NodeFilesystemSpaceFillingUp: true
      NodeFilesystemAlmostOutOfSpace: true
    additionalRuleGroupLabels: {}

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
      resources:
        requests:
          cpu: 1m
          memory: 1Mi
        limits:
          cpu: 1000m
          memory: 3Gi
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by:
          - alertname
          - severity
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: slack
        routes:
          - receiver: "null"
            match:
              alertname: Watchdog
          - receiver: slack
      receivers:
        - name: slack
          slack_configs:
            - api_url: https://slack.hook.fake.url
              channel: '#leapxpert_slack_channel'
              send_resolved: true
              username: AlertManager - DEV {{ .Status | toUpper }}
              color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
              icon_emoji: '{{ template "slack.emoji" . }}'
              icon_url: ""
              title: '{{ template "slack.title" . }}'
              title_link: ""
              pretext: ""
              text: |-
                {{ range .Alerts }}
                  *Summary:* {{ .Annotations.summary }}
                  *Description:* {{ .Annotations.description }}
                  *Details:*
                  {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                  {{ end }}
                {{ end }}
        - name: "null"
      templates:
        - /etc/alertmanager/config/*.tpl

  prometheusOperator:
    resources:
      requests:
        cpu: 1m
        memory: 1Mi
      limits:
        cpu: 1000m
        memory: 3Gi

  prometheus:
    enabled: true
    prometheusSpec:
      remoteWrite:
        - url: https://monitoring.obs.leapxpert.io/api/v1/push
          headers:
            X-Scope-OrgID: lxp-ci
          basicAuth:
            username:
              name: kube-prometheus-stack-mimir-auth-secret
              key: username
            password:
              name: kube-prometheus-stack-mimir-auth-secret
              key: password
      remoteWriteDashboards: true
      resources:
        requests:
          cpu: 1m
          memory: 1Mi
        limits:
          cpu: 1000m
          memory: 3Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: standard
      additionalScrapeConfigAppendix: ""
      awsNodeExporter:
        - accountId: '000000000000'
          region: ap-southeast-1
          accessKey: 000000000000_access_key
          secretKey: 000000000000_secret_key
        - accountId: '000000000001'
          region: ap-southeast-2
          accessKey: 000000000001_access_key
          secretKey: 000000000001_secret_key
      dcNodeExporter:
        basicAuth:
          username: example_user
          password: example_password
        cluster: lxp-ci
      certManager:
        enabled: true
        namespace: cert-manager
      externalLabels:
        cluster: test-cluster-scope

  grafana:
    adminPassword: random_password
    persistence:
      storageClassName: standard
    resources:
      requests:
        cpu: 1m
        memory: 1Mi
      limits:
        cpu: 1000m
        memory: 3Gi
    env:
      GF_AUTH_GITHUB_CLIENT_SECRET: sample_github_client_secret
    grafana.ini:
      dashboards:
        default_home_dashboard_path: /tmp/dashboards/k8s-resources-cluster.json
      server:
        root_url: https://sample.domain/grafana/
        domain: sample.domain
        serve_from_sub_path: true
      users:
        viewers_can_edit: true
      auth.github:
        enabled: true
        client_id: sample_github_client_id
        client_secret: sample_github_client_secret
        auth_url: https://github.com/login/oauth/authorize
        token_url: https://github.com/login/oauth/access_token
        allow_sign_up: true
        scopes: user:email, read:org
        allowed_organizations: LeapXpert
      auth.basic:
        enabled: true
    istio:
      domains:
        - ops.domain.local

  kube-state-metrics:
    resources:
      requests:
        cpu: 1m
        memory: 1Mi
      limits:
        cpu: 1000m
        memory: 3Gi

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 1m
        memory: 1Mi
      limits:
        cpu: 1000m
        memory: 3Gi
# ---------------------------------------------
kubePrometheusStackAddOns:
  enabled: true
# ---------------------------------------------
kube-prometheus-stack-add-ons:
  fullnameOverride: kube-prometheus-stack-add-ons
  runbook:
    enabled: true
  defaultRules:
    rules:
      appMethodExecution: true
      appApiServer: true
      appAudit: true
      appIgateway: true
      appAuthentication: true
      appCustomermodelsync: true
      appErrorLogs: true
      appImessageArchivingIntegration: true
      appSmsIntegration: true
      appTeam2bintegration: true
      appWechatIntegration: true
      appWechatMiniappIntegration: true
      appWecomIntegration: true
      appWhatsappArchivedGateway: true
      appWhatsappNativeIntegration: true
      appWhatsappintegrationArchived: true
      featureDataRetention: true
      internalAdditionalKubeStateMetrics: true
      internalKubernetesResources: true
      internalKubernetesStorage: true
      internalNodeExporter: true
      prometheus: true
    extraLabels:
      l1Support:
        team: l1-support
      l2Support:
        team: l2-support
      devopsSupport:
        team: devops-support
  namespaceSelector:
    istiod:
      enabled: true
      namespace: istio-system
    kafka:
      enabled: true
      namespace: default
    synapse:
      enabled: true
      namespace: default
    vault:
      enabled: true
      namespace: default
    velero:
      enabled: true
      namespace: velero

  dashboardsSelector:
    elasticsearch:
      enabled: true
    logging:
      enabled: true
    lxpAzureMetrics:
      enabled: true
    lxpCore:
      enabled: true
    lxpCloudwatchMetrics:
      enabled: true
    lxpData:
      enabled: true
    lxpIstio:
      enabled: true
    lxpKafka:
      enabled: false
    matrix:
      enabled: true
    slo:
      enabled: true
    velero:
      enabled: true

  istioTelemetry:
    namespaces:
      - lxp-core
      - lxp-integration
