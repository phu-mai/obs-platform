      - https://api.leapxpert.dev
      - https://mail.leapxpert.dev
      - https://matrix.leapxpert.dev/_matrix/client/versions
      - https://minio-public.leapxpert.dev/minio/login
      - https://minio.leapxpert.dev/minio/login
      - https://ops.leapxpert.dev/auth
      - https://ops.leapxpert.dev/mongo
      - https://ops.leapxpert.dev/mockserver/dashboard
      - https://ops.leapxpert.dev/grafana
      - https://ops.leapxpert.dev/kiali
      - https://ops.leapxpert.dev/whatsapp/85252106916/
      - https://org-admin.leapxpert.dev
      - https://public.leapxpert.dev
      - https://site-admin.leapxpert.dev
      - https://start.leapxpert.dev
      - https://web.leapxpert.dev
# ---------------------------------------------
grafana-agent:
  agent:
    common:
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: voip-edge
    static:
      daemonset:
        enabled: true
        logsClientsConfig:
          remoteWriteConfig:
            - url: http://loki:3100/loki/api/v1/push
              basic_auth:
                password: bar
                username: foo
              external_labels:
                cluster: cluster-name
              tenant_id: tenant-id
          additionalLogsConfigs:
            - job_name: syslog
              syslog:
                listen_address: 0.0.0.0:1514
                labels:
                  job: syslog
              relabel_configs:
                - source_labels: [__syslog_message_hostname]
                  target_label: host
                - source_labels: [__syslog_message_severity]
                  target_label: level
                - source_labels: [__syslog_message_app_name]
                  target_label: app
                - source_labels: [__syslog_connection_hostname]
                  target_label: node_name
        tracesClientsConfig:
          remoteWriteConfig:
            - endpoint: tempo.tracing:4317
              headers:
                x-scope-orgid: lxp-ci
                authorization: Basic example_token
              sending_queue:
                num_consumers: 4
                queue_size: 100
              retry_on_failure:
                enabled: true
                initial_interval: 10s
                max_interval: 60s
                max_elapsed_time: 10m
          additionalTracesReceiverConfigs:
            otlp/2:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:55690
        metricsClientsConfig:
          enabled: true
        integrationsConfig:
          frontendMonitoring:
            enabled: true
            corsAllowedOrigins:
              - web.am.example.local
              - org.admin.example.local
            istioIngress:
              namespace: istio-system
              domains:
                - ops-fd.example.local
            rateLimiting:
              burstiness: 100
              enabled: true
              rps: 100
          additionalIntegrationsConfigs:
            eventhandler:
              cache_path: /etc/eventhandler/eventhandler.cache
      statefulset:
        enabled: true
        mode: static
        extraArgs:
          - -enable-features=integrations-next
        enableReporting: false
        logsClientsConfig:
          remoteWriteConfig:
            - url: http://loki:3100/loki/api/v1/push
              basic_auth:
                password: bar
                username: foo
              external_labels:
                cluster: cluster-name
              tenant_id: tenant-id
        snmpMonitoring:
          enabled: false
          config:
            snmpTargets:
              - name: sbc
                address: random_ip
                auth: public_v3
                module: module_name
                walk_params: private
        volumes:
          extra:
            - name: queue-volume
              hostPath:
                path: /tmp/agent
        mounts:
          varlog: true
          extra:
            - name: queue-volume
              mountPath: /tmp/agent
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes: [ "ReadWriteOnce" ]
              storageClassName: standard
              resources:
                requests:
                  storage: 1Gi
    flow:
      daemonset:
        pyroScopeClientsConfig:
          username: sample_username
          password: sample_password
          cluster: lxp-ci
  service:
    static:
      statefulset:
        enabled: true
    flow:
      daemonset:
        enabled: true
  serviceMonitor:
    static:
      statefulset:
        enabled: true
        additionalLabels:
          observability: prometheus-operator
