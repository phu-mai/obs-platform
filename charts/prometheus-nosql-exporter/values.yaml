replicaCount: 1

image:
  repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/prometheus-nosql-exporter
  pullPolicy: IfNotPresent
  tag: null

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

nosql:
  database: leapXpert
  deploymentType: "MONGO_DB"
  uri: mongodb://username:password@localhost:27017/?authSource=admin&replicaSet=myRepl

serviceMonitor:
  enabled: true
  interval: "120s"
  additionalLabels: {}
  annotations: {}
  scrapeTimeout: 90s

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 9088

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Name of an externally managed secret (in the same namespace) containing the connection uri as key `mongodb-uri`.
# If this is provided, the value mongodb.uri is ignored.
existingSecret:
  name: ""
  key: "mongodb-uri"
