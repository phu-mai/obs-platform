{{- if and .Values.rbac.create (not .Values.rbac.namespaceScope.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "promtail.serviceAccountName" . }}
  namespace: {{ include "promtail.namespaceName" . }}
  labels:
    {{- include "promtail.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- if and .Values.rbac.create .Values.rbac.namespaceScope.enabled }}
{{- $root := . }}
{{- range $namespaces := .Values.rbac.namespaceScope.namespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "promtail.serviceAccountName" $root }}
  namespace: {{ $namespaces }}
  labels:
    {{- include "promtail.labels" $root | nindent 4 }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml $root | nindent 4 }}
  {{- end }}
{{- with $root.Values.serviceAccount.imagePullSecrets  }}
imagePullSecrets:
  {{- toYaml $root | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
