{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ template "prometheus-mongodb-exporter.serviceAccountName" . }}
  namespace: {{ template "prometheus-mongodb-exporter.namespace" . }}
  labels:
    {{- include "prometheus-mongodb-exporter.labels" . | nindent 4 }}
{{- end -}}
