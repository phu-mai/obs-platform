replicaCount: 1

image:
  repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/whatsapp-version-exporter
  pullPolicy: IfNotPresent
  tag: null

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
## Override the deployment namespace
##
namespaceOverride: ""

config:
  whatsappVersions:
  - v2.51.3: "April 25, 2024"
  - v2.51.2: "April 25, 2024"
  - v2.51.1: "April 25, 2024"
  - v2.49.6: "April 25, 2024"
  - v2.49.5: "January 25, 2024"
  - v2.49.4: "January 25, 2024"
  - v2.49.3: "January 25, 2024"
  - v2.49.2: "January 25, 2024"
  - v2.49.1: "January 25, 2024"
  - v2.47.7: "October 26, 2023"
  - v2.47.6: "October 26, 2023"
  - v2.47.3: "October 26, 2023"
  - v2.45.5: "September 20, 2023"
  - v2.47.2: "October 26, 2023"
  - v2.45.4: "September 20, 2023"
  - v2.47.1: "October 26, 2023"
  - v2.45.3: "September 20, 2023"
  - v2.45.2: "August 30, 2023"
  - v2.45.1: "July 8, 2023"

serviceMonitor:
  enabled: true
  interval: ""
  additionalLabels: {}
  annotations: {}
  # scrapeTimeout: 10s

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 9088

resources:
  limits:
    cpu: 50m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
