{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "whatsapp-version-exporter.serviceAccountName" . }}
  namespace: {{ include "whatsapp-version-exporter.namespace" . }}
  labels:
    {{- include "whatsapp-version-exporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
