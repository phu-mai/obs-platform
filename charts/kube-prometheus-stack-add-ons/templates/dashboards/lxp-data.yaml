              "description": "# Conflicts\nLogical replication behaves similarly to normal DML (Data Manipulation Language) operations in that the data will be updated even if it was changed locally on the subscriber node. If incoming data violates any constraints the replication will stop. This is referred to as a conflict. When replicating UPDATE or DELETE operations, missing data will not produce a conflict and such operations will simply be skipped.\n\nA conflict will produce an error and will stop the replication; it must be resolved manually by the user. Details about the conflict can be found in the subscriber's server log.\n\npg_stat_database_conflicts displays statistics about database conflicts.\n\n# Deadlocks\nIn concurrent systems where resources are locked, two or more processes can end up in a state in which each process is waiting for the other one. This state is called a deadlock. Deadlocks are an important issues that can happen in any database and can be scary when you encounter them for the first time.\n\nRef. https://www.postgresql.org/docs/10/monitoring-stats.html#MONITORING-STATS-VIEWS\n\n",
