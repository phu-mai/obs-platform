          "id": 247,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "### Dashboard Naming\nLeapXpert dashboards will be created with prefix `lxp-`.\n\n`lxp-summary` is used to display all kubernetes state metrics and application metrics\n\n### Metrics\nThis dashboard will cover the following items\n\n* **Cluster Overview**: display high level overview about all deployments on cluster (e.g number of statefulset, deployment, deamonset, etc).\n* **Cluster Rolling Upgrade Details**: display up-to-date rolling upgrade on all statefulsets, deployments, daemonsets on cluster.\n* **Cluster Image List**: display all docker image repositories and tags. This will help to check if any release tags hasn't been updated on cluster.\n* **Cluster Usage Details**: display all instant resource usage details of CPU and Memory of all pods in cluster. If you find some rows has empty data then that deployment/statefulset/daemonset doesn't have resource requests/limits defined.\n* **Cluster Event Overview**: display 3 events\n  * OOMKilled \n  * CrashLoopBackOff\n  * Pod is failed to schedule with states Pending, Unknown, Failed\n* **Application Error Logs**: select logs datasource manually is required\n  * Error logs count by app \n  * Error logs count by app and exception\n* **Application Metrics Overview**: display overview instant application RED metrics (Request, Error, Duration).\n* **Application Metrics Details**: display application requests overview in timeseries\n  * gRPC RED metrics\n  * Method execution duration\n* **Application Common Client Metrics - Kafka**: display overview of Kafka client metrics\n* **Application Common Client Metrics - Redis**: display overview of Redis client metrics\n* **Application Common Client Metrics - Local Cache**: display overview of app's local cache\n* **Application Common Client Metrics - MongoDB**: display overview of MongoDB client metrics\n* **Istio**: display RED metrics of mesh proxy sidecar on inter-services",
            "mode": "markdown"
          },
