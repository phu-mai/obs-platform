            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "### \bInformation\nIstio is core service mesh that Leapxpert uses to power the microservices architecture.\n\n<img src=\"https://istio.io/latest/docs/ops/deployment/architecture/arch.svg\" alt=\"drawing\" width=\"500\"/>\n\n### How to use this dashboard\n* Reporter: This identifies the reporter of the request. It is set to `destination` if report is from a server Istio proxy and `source` if report is from a client Istio proxy or a gateway.\n* Source Workload: This identifies the name of source workload which controls the source, or `unknown` if the source information is missing.\n* Source Workload Namespace: This identifies the namespace of the source workload, or `unknown` if the source information is missing.\n* Destination Workload: This identifies the name of destination workload, or `unknown` if the destination information is missing.\n* Destination Workload Namespace: This identifies the namespace of the destination workload, or `unknown` if the destination information is missing.\n* Destination Service: This identifies destination service host responsible for an incoming request. Ex: details.default.svc.cluster.local.\n\n### Metrics\nThis dashboard will contain metrics of the following services\n* `Control Plane Metrics` provides general context about Istio control plane\n* `Mesh Metrics` provides genernal context about all mesh services managed by istio\n* `HTTP/gRPC Workload Metrics` provides detailed metrics for source and destination HTTP/gRPC workload only\n* `TCP Workload Metrics` provides detailed metrics for source and destination TCP workload only\n* `HTTP/gRPC Service Metrics` provides detailed metrics for HTTP/gRPC for destination service only\n* `TCP Service Metrics` provides detailed metrics for TCP destination service only",
            "mode": "markdown"
