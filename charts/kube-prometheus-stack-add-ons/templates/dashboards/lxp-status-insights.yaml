            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "### Dashboard Naming\nLeapXpert dashboards will be created with prefix `lxp-`.\n\n`lxp-status-insights` is known as drilled down dashboard of `lxp-status` dashboard which will carry time when you click on drill down.\n\nWhat are differences between `lxp-status` and `lxp-status-insights`\n* `lxp-status` will include Kuberetes cluster graphs and only overview application metrics.\n* `lxp-status-insights` will have more insight metrics and will be used mainly to debug the issues related to FMOP microservices.\n\n### Metrics\nThis dashboard will cover the following items\n\n* **Application Metrics Details**: display application requests overview in timeseries\n  * gRPC RED metrics\n  * Method execution duration\n* **Application Common Client Metrics - Kafka**: display overview of Kafka client metrics\n* **Application Common Client Metrics - Redis**: display overview of Redis client metrics\n* **Application Common Client Metrics - Local Cache**: display overview of app's local cache\n* **Application Common Client Metrics - MongoDB**: display overview of MongoDB client metrics\n* **Java Metrics**: display usage of JVM\n* **Golang Metrics**: display usage of Golang services\n* **Istio**: display RED metrics of mesh proxy sidecar on inter-services",
            "mode": "markdown"
          },
          "pluginVersion": "9.2.4",
          "title": "LeapXpert Status Insights Introduction",
          "type": "text"
        },
