{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and (semverCompare ">=1.14.0-0" $kubeTargetVersion) (semverCompare "<9.9.9-9" $kubeTargetVersion) .Values.defaultRules.rules.internalAdditionalKubeStateMetrics }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ template "kube-prometheus-stack-add-ons.fullname" . }}-internal-additional-kube-state-metrics
  namespace: {{ template "kube-prometheus-stack-add-ons.namespace" . }}
  labels:
{{ include "kube-prometheus-stack-add-ons.labels" . | indent 4 }}
spec:
  groups:
    - name: internal-additional-kube-state-metrics.rules
      rules:
        {{- if not (.Values.defaultRules.disabled.L2AuditContainerOOMKilled | default false) }}
        - alert: L2AuditContainerOOMKilled
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been OOMKilled {{`{{`}} $value {{`}}`}} times in the last 5 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-l2auditcontaineroomkilled"
            {{- end }}
          expr: |
            (kube_pod_container_status_restarts_total{container="audit"} - kube_pod_container_status_restarts_total{container="audit"} offset 5m >= 1)
            and ignoring (reason)
            min_over_time(kube_pod_container_status_last_terminated_reason{container="audit",reason="OOMKilled"}[5m]) == 1
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KubeContainerOOMKilled | default false) }}
        - alert: L2KubeContainerOOMKilled
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been OOMKilled {{`{{`}} $value {{`}}`}} times in the last 15 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubecontaineroomkilled"
            {{- end }}
          expr: |
            (
              increase(
                (
                  kube_pod_container_status_restarts_total{namespace!~"monitoring|logging|tracing|kube-system"}
                    -
                  kube_pod_container_status_restarts_total{namespace!~"monitoring|logging|tracing|kube-system"} offset 15m >= 1)[15m:]
                )
              and ignoring (reason)
              min_over_time(
                kube_pod_container_status_last_terminated_reason{namespace!~"monitoring|logging|tracing|kube-system",reason="OOMKilled"}[15m]
              )
            ) > 3
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3KubeContainerOOMKilled | default false) }}
        - alert: L3KubeContainerOOMKilled
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been OOMKilled {{`{{`}} $value {{`}}`}} times in the last 15 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubecontaineroomkilled"
            {{- end }}
          expr: |
            (
              increase(
                (
                  kube_pod_container_status_restarts_total{namespace=~"monitoring|logging|tracing|kube-system"}
                    -
                  kube_pod_container_status_restarts_total{namespace=~"monitoring|logging|tracing|kube-system"} offset 15m >= 1)[15m:]
                )
              and ignoring (reason)
              min_over_time(
                kube_pod_container_status_last_terminated_reason{namespace=~"monitoring|logging|tracing|kube-system",reason="OOMKilled"}[15m]
              )
            ) > 3
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KubeInitContainerOOMKilled | default false) }}
        - alert: L2KubeInitContainerOOMKilled
          annotations:
            summary: |
              Init container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been OOMKilled {{`{{`}} $value {{`}}`}} times in the last 15 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubeinitcontaineroomkilled"
            {{- end }}
          expr: |
            (
              increase(
                (
                  kube_pod_init_container_status_restarts_total{namespace!~"monitoring|logging|tracing|kube-system"}
                    -
                  kube_pod_init_container_status_restarts_total{namespace!~"monitoring|logging|tracing|kube-system"} offset 15m >= 1)[15m:]
                )
              and ignoring (reason)
              min_over_time(
                kube_pod_init_container_status_terminated_reason{namespace!~"monitoring|logging|tracing|kube-system",reason="OOMKilled"}[15m]
              )
            ) > 3
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3KubeInitContainerOOMKilled | default false) }}
        - alert: L3KubeInitContainerOOMKilled
          annotations:
            summary: |
              Init container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been OOMKilled {{`{{`}} $value {{`}}`}} times in the last 15 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubeinitcontaineroomkilled"
            {{- end }}
          expr: |
            (
              increase(
                (
                  kube_pod_init_container_status_restarts_total{namespace=~"monitoring|logging|tracing|kube-system"}
                    -
                  kube_pod_init_container_status_restarts_total{namespace=~"monitoring|logging|tracing|kube-system"} offset 15m >= 1)[15m:]
                )
              and ignoring (reason)
              min_over_time(
                kube_pod_init_container_status_terminated_reason{namespace=~"monitoring|logging|tracing|kube-system",reason="OOMKilled"}[15m]
              )
            ) > 3
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KubeContainerLivenessProbeFailed | default false) }}
        - alert: L2KubeContainerLivenessProbeFailed
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been crashed {{`{{`}} $value {{`}}`}} times in the last 15 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubecontainerlivenessprobefailed"
            {{- end }}
          expr: |
            (
              increase(
                (
                  kube_pod_container_status_restarts_total{namespace!~"monitoring|logging|tracing|kube-system"}
                    -
                  kube_pod_container_status_restarts_total{namespace!~"monitoring|logging|tracing|kube-system"} offset 15m >= 1)[15m:]
                )
              and ignoring (reason)
              min_over_time(
                kube_pod_container_status_last_terminated_reason{namespace!~"monitoring|logging|tracing|kube-system",reason="Error"}[15m]
              )
            ) > 3
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3KubeContainerLivenessProbeFailed | default false) }}
        - alert: L3KubeContainerLivenessProbeFailed
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}}
              in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has been crashed {{`{{`}} $value {{`}}`}} times in the last 15 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubecontainerlivenessprobefailed"
            {{- end }}
          expr: |
            (
              increase(
                (
                  kube_pod_container_status_restarts_total{namespace=~"monitoring|logging|tracing|kube-system"}
                    -
                  kube_pod_container_status_restarts_total{namespace=~"monitoring|logging|tracing|kube-system"} offset 15m >= 1)[15m:]
                )
              and ignoring (reason)
              min_over_time(
                kube_pod_container_status_last_terminated_reason{namespace=~"monitoring|logging|tracing|kube-system",reason="Error"}[15m]
              )
            ) > 3
          for: 0m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KubeManyNodesNotReady | default false) }}
        - alert: L2KubeManyNodesNotReady
          annotations:
            summary: "{{`{{`}} $value | humanizePercentage {{`}}`}} percent of kubernetes nodes are not ready"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubemanynodesnotready"
            {{- end }}
          expr: |
            count by (cluster) (kube_node_status_condition{condition="Ready",status="true"} == 0) > 1
              and
            (
              count by (cluster) (kube_node_status_condition{condition="Ready",status="true"} == 0)
              /
              count by (cluster) (kube_node_status_condition{condition="Ready",status="true"})
            ) * 100 > 20
          for: 1m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KKubePodFailedToPullImage | default false) }}
        - alert: L2KKubePodFailedToPullImage
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has failed to pull image in the last 5 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubepodfailedtopullimage"
            {{- end }}
          expr: |
            sum by (pod, namespace, container, cluster, reason) (
                kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff",namespace!~"monitoring|logging|tracing|kube-system"}
            ) == 1
          for: 5m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3KKubePodFailedToPullImage | default false) }}
        - alert: L3KKubePodFailedToPullImage
          annotations:
            summary: |
              Container {{`{{`}} $labels.container {{`}}`}} of pod {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}}
              has failed to pull image in the last 5 minutes.
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-kubepodfailedtopullimage"
            {{- end }}
          expr: |
            sum by (pod, namespace, container, cluster, reason) (
                kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff",namespace=~"monitoring|logging|tracing|kube-system"}
            ) == 1
          for: 5m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KubeDeploymentReplicasMismatch | default false) }}
        - alert: L2KubeDeploymentReplicasMismatch
          annotations:
            description: Deployment {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.deployment {{`}}`}} has not matched the expected number of replicas for longer than 15 minutes.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentreplicasmismatch
            summary: Deployment has not matched the expected number of replicas.
          expr: |-
            (
              kube_deployment_spec_replicas{job="kube-state-metrics",namespace!~"monitoring|logging|tracing|kube-system"}
                >
              kube_deployment_status_replicas_available{job="kube-state-metrics",namespace!~"monitoring|logging|tracing|kube-system"}
            ) and (
              changes(kube_deployment_status_replicas_updated{job="kube-state-metrics",namespace!~"monitoring|logging|tracing|kube-system"}[10m])
                ==
              0
            )
          for: 15m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3KubeDeploymentReplicasMismatch | default false) }}
        - alert: L3KubeDeploymentReplicasMismatch
          annotations:
            description: Deployment {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.deployment {{`}}`}} has not matched the expected number of replicas for longer than 15 minutes.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentreplicasmismatch
            summary: Deployment has not matched the expected number of replicas.
          expr: |-
            (
              kube_deployment_spec_replicas{job="kube-state-metrics",namespace=~"monitoring|logging|tracing|kube-system"}
                >
              kube_deployment_status_replicas_available{job="kube-state-metrics",namespace=~"monitoring|logging|tracing|kube-system"}
            ) and (
              changes(kube_deployment_status_replicas_updated{job="kube-state-metrics",namespace=~"monitoring|logging|tracing|kube-system"}[10m])
                ==
              0
            )
          for: 15m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L2KubeStatefulSetReplicasMismatch | default false) }}
        - alert: L2KubeStatefulSetReplicasMismatch
          annotations:
            description: StatefulSet {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.statefulset {{`}}`}} has not matched the expected number of replicas for longer than 15 minutes.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetreplicasmismatch
            summary: StatefulSet has not matched the expected number of replicas.
          expr: |-
            (
              kube_statefulset_status_replicas_ready{job="kube-state-metrics",namespace!~"monitoring|logging|tracing|kube-system"}
                !=
              kube_statefulset_status_replicas{job="kube-state-metrics",namespace!~"monitoring|logging|tracing|kube-system"}
            ) and (
              changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics",namespace!~"monitoring|logging|tracing|kube-system"}[10m])
                ==
              0
            )
          for: 15m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3KubeStatefulSetReplicasMismatch | default false) }}
        - alert: L3KubeStatefulSetReplicasMismatch
          annotations:
            description: StatefulSet {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.statefulset {{`}}`}} has not matched the expected number of replicas for longer than 15 minutes.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetreplicasmismatch
            summary: StatefulSet has not matched the expected number of replicas.
          expr: |-
            (
              kube_statefulset_status_replicas_ready{job="kube-state-metrics",namespace=~"monitoring|logging|tracing|kube-system"}
                !=
              kube_statefulset_status_replicas{job="kube-state-metrics",namespace=~"monitoring|logging|tracing|kube-system"}
            ) and (
              changes(kube_statefulset_status_replicas_updated{job="kube-state-metrics",namespace=~"monitoring|logging|tracing|kube-system"}[10m])
                ==
              0
            )
          for: 15m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
{{- end }}
