{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and (semverCompare ">=1.14.0-0" $kubeTargetVersion) (semverCompare "<9.9.9-9" $kubeTargetVersion) .Values.defaultRules.rules.recordingDataplaneMongodb }}
{{- if and .Values.slo.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ template "kube-prometheus-stack-add-ons.fullname" . }}-dataplane-mongodb-recording
  namespace: {{ template "kube-prometheus-stack-add-ons.namespace" . }}
  labels:
{{ include "kube-prometheus-stack-add-ons.labels" . | indent 4 }}
spec:
  groups:
    - name: mongodb-recording.rules
      interval: 1m
      rules:
        - record: slo:mongo:mongodb_up_5m
          expr: sum_over_time(mongodb_up[5m:]) / count_over_time(mongodb_up[5m:]) * 100
        - record: slo:mongo:mongodb_up_30m
          expr: sum_over_time(mongodb_up[30m:]) / count_over_time(mongodb_up[30m:]) * 100
        - record: slo:mongo:mongodb_up_1h
          expr: sum_over_time(mongodb_up[1h:]) / count_over_time(mongodb_up[1h:]) * 100
        - record: slo:mongo:mongodb_up_2h
          expr: sum_over_time(mongodb_up[2h:]) / count_over_time(mongodb_up[2h:]) * 100
        - record: slo:mongo:mongodb_up_6h
          expr: sum_over_time(mongodb_up[6h:]) / count_over_time(mongodb_up[6h:]) * 100
        - record: slo:mongo:mongodb_up_1d
          expr: sum_over_time(mongodb_up[1d:]) / count_over_time(mongodb_up[1d:]) * 100
        - record: slo:mongo:mongodb_up_3d
          expr: sum_over_time(mongodb_up[3d:]) / count_over_time(mongodb_up[3d:]) * 100
        - record: slo:mongo:mongodb_up_30d
          expr: sum_over_time(mongodb_up[30d]) / count_over_time(mongodb_up[30d]) * 100

        - record: slo:mongo:mongodb_replset_primary_health_5m
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[5m:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[5m:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_30m
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[30m:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[30m:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_1h
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[1h:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[1h:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_2h
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[2h:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[2h:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_6h
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[6h:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[6h:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_1d
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[1d:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[1d:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_3d
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[3d:]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[3d:]) * 100
        - record: slo:mongo:mongodb_replset_primary_health_30d
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[30d]) / count_over_time(mongodb_mongod_replset_member_health{state="PRIMARY"}[30d]) * 100

        - record: slo:mongo:mongodb_replset_secondary_health_5m
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[5m:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[5m:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_30m
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[30m:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[30m:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_1h
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[1h:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[1h:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_2h
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[2h:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[2h:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_6h
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[6h:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[6h:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_1d
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[1d:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[1d:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_3d
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[3d:]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[3d:]) * 100
        - record: slo:mongo:mongodb_replset_secondary_health_30d
          expr: sum_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[30d]) / count_over_time(mongodb_mongod_replset_member_health{state="SECONDARY"}[30d]) * 100
{{- end }}
{{- end }}
