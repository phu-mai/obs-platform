{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and (semverCompare ">=1.14.0-0" $kubeTargetVersion) (semverCompare "<9.9.9-9" $kubeTargetVersion) .Values.defaultRules.rules.dataplanePostgres }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ template "kube-prometheus-stack-add-ons.fullname" . }}-dataplane-postgres
  namespace: {{ template "kube-prometheus-stack-add-ons.namespace" . }}
  labels:
{{ include "kube-prometheus-stack-add-ons.labels" . | indent 4 }}
spec:
  groups:
    - name: postgres.rules
      interval: 1m
      rules:
        {{- if not (.Values.defaultRules.disabled.PostgresDown | default false) }}
        - alert: PostgresDown
          annotations:
            summary: "Posgres instance {{`{{`}} $labels.pod {{`}}`}} on {{`{{`}} $labels.namespace {{`}}`}} has been down for 2m."
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresdown"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (pg_up) == 0
          for: 2m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresExporterDown | default false) }}
        - alert: PostgresExporterDown
          annotations:
            summary: "Prometheus couldn't scrape metrics from {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}}"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresexporterdown"
            {{- end }}
          expr: up{container="metrics",instance=~".+:9187"} == 0
          for: 5m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresLongRunningQueriesCount | default false) }}
        - alert: PostgresLongRunningQueriesCount
          annotations:
            summary: "Postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} has more than 2 long running queries"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgreslongrunningqueriescount"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (pg_long_running_queries_count{pod=~"postgres-(primary|read)-[0-9]"}) > 2
          for: 5m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresLongLivedTransaction | default false) }}
        - alert: PostgresLongLivedTransaction
          annotations:
            summary: "Database {{`{{`}} $labels.datname {{`}}`}} on postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} has a transaction in state {{`{{`}} $labels.state {{`}}`}} currently that started {{`{{`}} $value | humanizeDuration {{`}}`}} seconds ago"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgreslonglivedtransaction"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (pg_stat_activity_max_tx_duration) > 600
          for: 5m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresConnectionsTooHigh | default false) }}
        - alert: PostgresConnectionsTooHigh
          annotations:
            summary: "Connections on postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} are above 75% of max connection setting for 10m. Current us {{`{{`}} $value {{`}}`}}"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresconnectionstoohigh"
            {{- end }}
          expr: |
            sum by (app,cluster,namespace,pod) (pg_stat_activity_count)
              >
            max by (app,cluster,namespace,pod) (pg_settings_max_connections) * 0.75
          for: 10m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresVacuumAgeInSeconds | default false) }}
        - alert: PostgresVacuumAgeInSeconds
          annotations:
            summary: "Postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} has vacuum job running more than 1 hour"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresvacuumageinseconds"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (pg_vacuum_age_in_seconds) > 3600
          for: 5m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresVacuumAnalyzeAgeInSeconds | default false) }}
        - alert: PostgresVacuumAnalyzeAgeInSeconds
          annotations:
            summary: "Postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} has vacuum analyze job running more than 1 hour"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresvacuumanalyzeageinseconds"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (pg_vacuum_analyze_age_in_seconds) > 3600
          for: 5m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresStatDatabaseTempBytes | default false) }}
        - alert: PostgresStatDatabaseTempBytes
          annotations:
            summary: "Database {{`{{`}} $labels.datname {{`}}`}} on postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} have database temp files over 100MB. Current {{`{{`}} $value | humanize1024 {{`}}`}}B"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresstatdatabasetempbytes"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (rate(pg_stat_database_temp_bytes[5m])) > 100000000
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresLocksCount | default false) }}
        - alert: PostgresLocksCount
          annotations:
            summary: "Database {{`{{`}} $labels.datname {{`}}`}} on postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} has database lock higher than 100 for 5m. Current {{`{{`}} $value {{`}}`}}B"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgreslockscount"
            {{- end }}
          expr: sum by (app,cluster,namespace,mode,pod) (pg_locks_count) > 100
          for: 5m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresStatefulsetUnscheduable | default false) }}
        - alert: PostgresStatefulsetUnscheduable
          annotations:
            summary: "Postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} is unschedulable for 2m"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgresstatefulsetunscheduable"
            {{- end }}
          expr: |
            sum by (app,cluster,statefulset) (
              label_replace(kube_statefulset_status_replicas_ready{statefulset=~"postgres-(primary|read)"},"app","$1","statefulset","(.+)")
            )  == 0
          for: 2m
          labels:
            severity: critical
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.defaultRules.extraLabels.l2Support }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.PostgresSuperuserCount | default false) }}
        - alert: PostgresSuperuserCount
          annotations:
            summary: "Amount of postgres superuser in postgres instance {{`{{`}} $labels.pod {{`}}`}} in namespace {{`{{`}} $labels.namespace {{`}}`}} is not normal for 5m"
            {{- if .Values.runbook.enabled }}
            runbook_url: "{{ .Values.runbook.runbookUrl }}alert-name-postgressuperusercount"
            {{- end }}
          expr: sum by (app,cluster,namespace,pod) (pg_superuser_count) > 0
          for: 5m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
{{- end }}
