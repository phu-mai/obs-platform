{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and (semverCompare ">=1.14.0-0" $kubeTargetVersion) (semverCompare "<9.9.9-9" $kubeTargetVersion) .Values.defaultRules.rules.internalKubernetesResources }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ template "kube-prometheus-stack-add-ons.fullname" . }}-internal-kubernetes-resources
  namespace: {{ template "kube-prometheus-stack-add-ons.namespace" . }}
  labels:
{{ include "kube-prometheus-stack-add-ons.labels" . | indent 4 }}
spec:
  groups:
    - name: internal-kubernetes-resources.rules
      rules:
        {{- if not (.Values.defaultRules.disabled.CPUThrottlingHigh | default false) }}
        - alert: CPUThrottlingHigh
          annotations:
            description: '{{`{{`}} $value | humanizePercentage {{`}}`}} throttling of CPU in namespace {{`{{`}} $labels.namespace {{`}}`}} for container {{`{{`}} $labels.container {{`}}`}} in pod {{`{{`}} $labels.pod {{`}}`}}.'
            runbook_url: {{ .Values.defaultRules.runbookUrl }}/kubernetes/cputhrottlinghigh
            summary: Processes experience elevated CPU throttling.
          expr: |-
            sum(increase(container_cpu_cfs_throttled_periods_total{container!="",namespace!~"monitoring|logging|tracing|kube-system"}[5m])) by (cluster, container, pod, namespace)
                /
            sum(increase(container_cpu_cfs_periods_total{namespace!~"monitoring|logging|tracing|kube-system"}[5m])) by (cluster, container, pod, namespace)
                > ( 90 / 100 )
          for: 15m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if not (.Values.defaultRules.disabled.L3CPUThrottlingHigh | default false) }}
        - alert: L3CPUThrottlingHigh
          annotations:
            description: '{{`{{`}} $value | humanizePercentage {{`}}`}} throttling of CPU in namespace {{`{{`}} $labels.namespace {{`}}`}} for container {{`{{`}} $labels.container {{`}}`}} in pod {{`{{`}} $labels.pod {{`}}`}}.'
            runbook_url: {{ .Values.defaultRules.runbookUrl }}/kubernetes/cputhrottlinghigh
            summary: Processes experience elevated CPU throttling.
          expr: |-
            sum(increase(container_cpu_cfs_throttled_periods_total{container!="",namespace=~"monitoring|logging|tracing|kube-system"}[5m])) by (cluster, container, pod, namespace)
                /
            sum(increase(container_cpu_cfs_periods_total{namespace=~"monitoring|logging|tracing|kube-system"}[5m])) by (cluster, container, pod, namespace)
                > ( 90 / 100 )
          for: 15m
          labels:
            severity: warning
            {{- with .Values.defaultRules.extraLabels.defaultLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- end }}
{{- end }}
