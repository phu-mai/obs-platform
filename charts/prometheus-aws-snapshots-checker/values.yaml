# Default values for prometheus-aws-snapshots-checker.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/prometheus-aws-snapshots-checker
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Define AWS configuration infomation
# https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html
aws:
  # Define AWS region
  region:
  # Define AWS credentials
  secrets:
    awsAccessKeyId: inputAwsAccessKeyId
    awsSecretAccessKey: inputAwsSecretAccessKeyId

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

service:
  type: ClusterIP
  port: 8080

serviceMonitor:
  enabled: true
  interval: ""
  additionalLabels: {}
  annotations: {}
  scrapeTimeout: ""
