      # -- Update strategy for updating deployed Pods.
      updateStrategy: {}

      # -- Whether to enable automatic deletion of stale PVCs due to a scale down operation, when agent.type is 'statefulset'.
      enableStatefulSetAutoDeletePVC: false

      # -- volumeClaimTemplates to add when agent.type is 'statefulset'.
      volumeClaimTemplates: []

      volumes:
        # -- Extra volumes to add to the Grafana Agent pod.
        extra: []

      ## -- Additional init containers to run.
      ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
      ##
      initContainers: []

      snmpMonitoring:
        # -- Enable SNMP monitoring
        enabled: false
        # -- SNMP monitoring mode. Can be "standalone" or "hfe".
        mode: standalone

        config:
          # -- SNMP config file username
          snmpUsername: sample_username
          # -- SNMP config file password
          snmpPassword: sample_password
          # -- SNMP config file priv password
          snmpPrivPassword: sample_priv_username
          # -- SNMP config file auth protocol
          snmpTargets:
            - name: sbc
              address: random_ip
              auth: public_v3
              module: module_name
              walk_params: private

