{{- if .Values.agent.static.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafana-agent.fullname" . }}-static-deployment
  labels:
    {{- include "grafana-agent.labels" . | nindent 4 }}
    agent-type: deployment
    mode: static
spec:
  {{- if not .Values.agent.static.deployment.autoscaling.enabled }}
  replicas: {{ .Values.agent.static.deployment.replicas }}
  {{- end }}
  {{- if ge (int .Capabilities.KubeVersion.Minor) 22 }}
  minReadySeconds: 10
  {{- end }}
  selector:
    matchLabels:
      {{- include "grafana-agent.selectorLabels" . | nindent 6 }}
      agent-type: deployment
      mode: static
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/static/deployment/configmap.yaml") . | sha256sum }}
        {{- if .Values.agent.static.deployment.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/static/deployment/secret.yaml") . | sha256sum }}
        {{- end }}
      {{- with .Values.agent.common.podAnnotations }}
        {{- toYaml . | nindent 4 }}
      {{- end }}
      labels:
        {{- include "grafana-agent.selectorLabels" . | nindent 8 }}
        agent-type: deployment
        mode: static
        {{- with .Values.agent.common.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "grafana-agent.serviceAccountName" . }}
      {{- if or .Values.global.image.pullSecrets .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- if .Values.global.image.pullSecrets }}
        {{- toYaml .Values.global.image.pullSecrets | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if .Values.agent.static.deployment.initContainers }}
      initContainers:
        {{- with .Values.agent.static.deployment.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: grafana-agent
          image: {{ .Values.global.image.registry | default .Values.image.registry }}/{{ .Values.image.repository }}{{ include "grafana-agent.imageId" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if not .Values.agent.common.enableReporting }}
            - --disable-reporting
            {{- end}}
            - -config.file=/etc/agent/config.yaml
            - -server.http.address={{ .Values.agent.common.listenAddr }}:{{ .Values.agent.common.listenPort }}
            {{- range .Values.agent.static.deployment.extraArgs }}
            - {{ . }}
            {{- end}}
          env:
            - name: AGENT_MODE
              value: static
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- with .Values.agent.static.deployment.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.agent.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.agent.common.listenPort }}
              name: http-metrics
            {{- range $portMap := .Values.agent.extraPorts }}
            - containerPort: {{ $portMap.targetPort }}
              {{- if $portMap.hostPort }}
              hostPort: {{ $portMap.hostPort }}
              {{- end}}
              name: {{ $portMap.name }}
              protocol: {{ coalesce $portMap.protocol "TCP" }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: {{ .Values.agent.common.listenPort }}
              scheme: {{ .Values.agent.common.listenScheme }}
            initialDelaySeconds: 10
            timeoutSeconds: 1
          {{- with .Values.agent.static.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agent.static.deployment.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/agent
            {{- if .Values.agent.static.deployment.mounts.varlog }}
            - name: varlog
              mountPath: /var/log
              readOnly: true
            {{- end }}
            {{- if .Values.agent.static.deployment.mounts.dockercontainers }}
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            {{- end }}
            {{- if .Values.agent.static.deployment.secret.create }}
            - name: secret
              mountPath: /tmp/secret
            {{- end }}
            {{- range .Values.agent.static.deployment.mounts.extra }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
      {{- if .Values.agent.common.priorityClassName }}
      priorityClassName: {{ .Values.agent.common.priorityClassName }}
      {{- end }}
      {{- if .Values.agent.common.hostNetwork }}
      hostNetwork: {{ .Values.agent.common.hostNetwork }}
      {{- end }}
      {{- if .Values.agent.static.deployment.hostPID }}
      hostPID: {{ .Values.agent.static.deployment.hostPID }}
      {{- end }}
      dnsPolicy: {{ .Values.agent.common.dnsPolicy }}
      {{- with .Values.agent.common.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.static.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.common.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "grafana-agent.fullname" . }}-static-deployment
        {{- if .Values.agent.static.deployment.mounts.varlog }}
        - name: varlog
          hostPath:
            path: /var/log
        {{- end }}
        {{- if .Values.agent.static.deployment.mounts.dockercontainers }}
        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
        {{- end }}
        {{- if .Values.agent.static.deployment.secret.create }}
        - name: secret
          secret:
            secretName: {{ include "grafana-agent.fullname" . }}-static-deployment
        {{- end }}
        {{- if .Values.agent.static.deployment.volumes.extra }}
        {{- toYaml .Values.agent.static.deployment.volumes.extra | nindent 8 }}
        {{- end }}
  {{- with .Values.agent.static.deployment.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
