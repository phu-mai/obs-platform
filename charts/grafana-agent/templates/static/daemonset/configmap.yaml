{{- if .Values.agent.static.daemonset.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana-agent.fullname" . }}-static-daemonset
  labels:
    {{- include "grafana-agent.labels" . | nindent 4 }}
    agent-type: daemonset
    mode: static
data:
  {{- if .Values.agent.static.daemonset.configMap.content }}
  config.yaml: |- {{- (tpl .Values.agent.static.daemonset.configMap.content .) | nindent 4 }}
  {{- else }}
  config.yaml: |- {{- .Files.Get "config/config.yaml" | trim | nindent 4 }}
  {{- end }}
{{- end }}
