{{- if .Values.agent.flow.daemonset.clustering.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grafana-agent.fullname" . }}-daemonset-cluster
  labels:
    {{- include "grafana-agent.labels" . | nindent 4 }}
    agent-type: daemonset
    mode: flow
spec:
  type: ClusterIP
  clusterIP: 'None'
  selector:
    {{- include "grafana-agent.selectorLabels" . | nindent 4 }}
    agent-type: daemonset
    mode: flow
  ports:
    # Do not include the -metrics suffix in the port name, otherwise metrics
    # can be double-collected with the non-headless Service if it's also
    # enabled.
    #
    # This service should only be used for clustering, and not metric
    # collection.
    - name: http
      port: {{ .Values.agent.common.listenPort }}
      targetPort: {{ .Values.agent.common.listenPort }}
      protocol: "TCP"
  {{- range $portMap := .Values.agent.flow.daemonset.extraPorts }}
    - name: {{ $portMap.name }}
      port: {{ $portMap.port }}
      targetPort: {{ $portMap.targetPort }}
      protocol: {{ coalesce $portMap.protocol "TCP" }}
  {{- end }}
{{- end }}
