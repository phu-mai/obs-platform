{{- if and .Values.agent.flow.deployment.enabled .Values.agent.flow.deployment.autoscaling.enabled }}
{{- if not (empty .Values.agent.flow.deployment.autoscaling.targetMemoryUtilizationPercentage)}}
  {{- $_ := .Values.agent.flow.deployment.resources.requests | required ".Values.agent.flow.deployment.resources.requests is required when using autoscaling." -}}
  {{- $_ := .Values.agent.flow.deployment.resources.requests.memory | required ".Values.agent.flow.deployment.resources.requests.memory is required when using autoscaling based on memory utilization." -}}
{{- end}}
{{- if not (empty .Values.agent.flow.deployment.autoscaling.targetCPUUtilizationPercentage)}}
  {{- $_ := .Values.agent.flow.deployment.resources.requests | required ".Values.agent.flow.deployment.resources.requests is required when using autoscaling." -}}
  {{- $_ := .Values.agent.flow.deployment.resources.requests.cpu | required ".Values.agent.flow.deployment.resources.requests.cpu is required when using autoscaling based on cpu utilization." -}}
{{- end}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "grafana-agent.fullname" . }}-flow-deployment
  labels:
    {{- include "grafana-agent.labels" . | nindent 4 }}
    agent-type: deployment
    mode: flow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "grafana-agent.fullname" . }}-flow-deployment
  {{- with .Values.agent.flow.deployment.autoscaling }}
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    # Changing the order of the metrics will cause ArgoCD to go into a sync loop
    # memory needs to be first.
    # More info in: https://github.com/argoproj/argo-cd/issues/1079
    {{- with .targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
