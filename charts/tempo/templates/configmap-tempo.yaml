apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "tempo.name" . }}
  namespace: {{ template "tempo.namespace" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  overrides.yaml: |
    overrides:
      {{- toYaml .Values.tempo.overrides | nindent 6 }}
  tempo.yaml: |
    {{- tpl .Values.config . | nindent 4 }}
