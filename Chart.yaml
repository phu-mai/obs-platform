---
apiVersion: v2
name: observability
description: LeapXpert Observability Kubernetes Helm Charts
type: application
version: 2.3.1
appVersion: "0.1.0"
kubeVersion: ">=1.18.0-0"
keywords:
  - operator
  - prometheus
  - pushgateway
  - blackbox-exporter
  - kube-prometheus-stack
  - grafana-stack
  - loki
  - tempo
  - tracing
  - azure-metrics-exporter
  - cloudwatch-exporter
dependencies:
  - name: grafana-agent
    version: "0.27.1"
    repository: "file://./charts/grafana-agent"
    condition: grafanaAgent.enabled
  - name: kube-prometheus-stack
    version: "59.0.0"
    repository: "file://./charts/kube-prometheus-stack"
    condition: kubePrometheusStack.enabled
  - name: prometheus-azure-metrics-exporter
    version: "0.2.2"
    repository: "file://./charts/prometheus-azure-metrics-exporter"
    condition: prometheusAzureMetricsExporter.enabled
  - name: prometheus-aws-snapshots-checker
    version: "0.1.1"
    repository: "file://./charts/prometheus-aws-snapshots-checker"
    condition: prometheusAwsSnapshotsChecker.enabled
  - name: kube-prometheus-stack-add-ons
    version: "0.3.5"
    repository: "file://./charts/kube-prometheus-stack-add-ons"
    condition: kubePrometheusStackAddOns.enabled
  - name: prometheus-blackbox-exporter
    version: "7.7.0"
    repository: "file://./charts/prometheus-blackbox-exporter"
    condition: prometheusBlackboxExporter.enabled
  - name: prometheus-cloudwatch-exporter
    version: "0.25.3"
    repository: "file://./charts/prometheus-cloudwatch-exporter"
    condition: prometheusCloudwatchExporter.enabled
  - name: prometheus-elasticsearch-exporter
    version: "5.1.1"
    repository: "file://./charts/prometheus-elasticsearch-exporter"
    condition: prometheusElasticsearchExporter.enabled
  - name: prometheus-mongodb-exporter
    version: "3.1.3"
    repository: "file://./charts/prometheus-mongodb-exporter"
    condition: prometheusMongodbExporter.enabled
  - name: loki
    version: "2.11.1"
    repository: "file://./charts/loki"
    condition: loki.enabled
  - name: loki-legacy
    version: "2.10.1"
    repository: "file://./charts/loki-legacy"
    condition: lokiLegacy.enabled
  - name: opentelemetry-collector
    version: "0.93.3"
    repository: "file://./charts/opentelemetry-collector"
    condition: opentelemetryCollector.enabled
  - name: promtail
    version: "6.15.3"
    repository: "file://./charts/promtail"
    condition: promtail.enabled
  - name: tempo
    version: "1.9.0"
    repository: "file://./charts/tempo"
    condition: tempo.enabled
  - name: whatsapp-version-exporter
    version: "1.0.2"
    repository: "file://./charts/whatsapp-version-exporter"
    condition: whatsappVersionExporter.enabled
  - name: prometheus-kafka-exporter
    version: "2.10.0"
    repository: "file://./charts/prometheus-kafka-exporter"
    condition: prometheusKafkaExporter.enabled
  - name: prometheus-eventhubs-exporter
    version: "0.1.3"
    repository: "file://./charts/prometheus-eventhubs-exporter"
    condition: prometheusEventhubsExporter.enabled
  - name: prometheus-nosql-exporter
    version: "0.1.0"
    repository: "file://./charts/prometheus-nosql-exporter"
    condition: prometheusNosqlExporter.enabled
  - name: jaeger
    version: "0.1.0"
    repository: "file://./charts/jaeger"
    condition: jaeger.enabled
