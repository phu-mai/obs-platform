---
prometheusAzureMetricsExporter:
  enabled: false
# ---------------------------------------------
prometheus-azure-metrics-exporter:
  fullnameOverride: prometheus-azure-metrics-exporter

  imagePullSecrets:
    - name: lxp-docker-registry-key

  image:
    repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/webdevops/azure-metrics-exporter

  service:
    type: ClusterIP
    port: 80

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podMonitor:
    additionalLabels:
      observability: prometheus-operator
    podMetricsEndpoints:
      interval: 5m
      scrapeTimeout: 30s
# ---------------------------------------------
kubePrometheusStack:
  enabled: true

kube-prometheus-stack:
  fullnameOverride: kube-prometheus-stack

  whatsappMonitor:
