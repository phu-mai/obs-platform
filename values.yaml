# ---------------------------------------------
opentelemetry-collector:
  fullnameOverride: opentelemetry-collector
  image:
    repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/otel/opentelemetry-collector-k8s
  imagePullSecrets:
    - name: lxp-docker-registry-key
  mode: daemonset
  config:
    processors:
      tail_sampling:
        policies:
          [
            {
              name: drop_noisy_traces_by_user_agent_original,
              type: string_attribute,
              string_attribute: {
                key: user_agent.original,
                values: [
                  ^(Blackbox Exporter\/.*)$,
                  ^(kube-probe\/.*)$,
                  ^(Prometheus\/.*)$,
                  ^(OTel-OTLP-Exporter-Java\/.*)$,
                  ^(FreshpingBot\/.*)$
                ],
                enabled_regex_matching: true,
                invert_match: true
              }
            },
            {
              name: drop_noisy_traces_by_user_agent,
              type: string_attribute,
              string_attribute: {
                key: user_agent,
                values: [
                  ^(Blackbox Exporter\/.*)$,
                  ^(kube-probe\/.*)$,
                  ^(Prometheus\/.*)$,
                  ^(OTel-OTLP-Exporter-Java\/.*)$,
                  ^(FreshpingBot\/.*)$
                ],
                enabled_regex_matching: true,
                invert_match: true
              }
            },
            {
              name: drop_noisy_traces_by_http_url,
              type: string_attribute,
              string_attribute: {
                key: http.url,
                values: [
                  ^(https:\/\/.+\/_matrix\/client\/.+\/sync.*)$,
                  ^(http:\/\/zipkin\/.*)$
                ],
                enabled_regex_matching: true,
                invert_match: true
              }
            },
          ]
    receivers:
      jaeger: null
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus: null
      zipkin:
        endpoint: 0.0.0.0:9411
    exporters:
      otlp:
        endpoint: jaeger.tracing:4317
        tls:
          insecure: true
    service:
      telemetry: null
      extensions:
        - health_check
        - memory_ballast
      pipelines:
        logs: null
        metrics: null
        traces:
          exporters:
            - otlp
          processors:
            - memory_limiter
            - batch
            - tail_sampling
          receivers:
            - otlp
            - zipkin

  serviceMonitor:
    enabled: true
    extraLabels:
      observability: prometheus-operator

  service:
    enabled: true

  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    metrics:
      enabled: true
# ---------------------------------------------
prometheusBlackboxExporter:
  enabled: false
# ---------------------------------------------
prometheus-blackbox-exporter:
  fullnameOverride: prometheus-blackbox-exporter
  image:
    registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
    pullSecrets:
      - lxp-docker-registry-key
  replicas: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - prometheus-blackbox-exporter
          topologyKey: kubernetes.io/hostname
  config:
    modules:
      http_2xx_3xx_4xx:
        http:
          no_follow_redirects: false
          preferred_ip_protocol: ip4
          valid_status_codes:
            - 200
            - 301
            - 302
            - 308
            - 401
            - 403
          valid_http_versions:
            - HTTP/1.1
            - HTTP/2.0
          tls_config:
            insecure_skip_verify: true
        prober: http
        timeout: 30s
      http_whatsapp_2xx:
        prober: http
        timeout: 30s
        http:
          valid_status_codes:
            - 200
          method: GET
          headers:
            Content-Type: application/json
          fail_if_body_not_matches_regexp:
            - '"connected"|"connecting"'
      tcp_connect:
        prober: tcp
        timeout: 30s
  serviceAccount:
    name: blackbox-exporter
  pspEnabled: false
  podAnnotations:
    proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/proxyCPU: 50m
    sidecar.istio.io/proxyCPULimit: 500m
    sidecar.istio.io/proxyMemory: 64Mi
    sidecar.istio.io/proxyMemoryLimit: 640Mi
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 50m
      memory: 50Mi
