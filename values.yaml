  kubeApiServer:
    enabled: false

  kubeControllerManager:
    enabled: false

  kubeEtcd:
    enabled: false

  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false

  coreDns:
    enabled: false

  kubeDns:
    enabled: false

  commonLabels:
    observability: prometheus-operator

  defaultRules:
    rules:
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubePrometheusNodeRecording: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
    disabled:
      CPUThrottlingHigh: true
      KubeCPUOvercommit: true
      KubeMemoryOvercommit: true
      PrometheusNotConnectedToAlertmanagers: true
      PrometheusRuleFailures: true

  customRules:
    KubeDeploymentReplicasMismatch:
      severity: critical
    KubeStatefulSetReplicasMismatch:
      severity: critical

  global:
    rbac:
      pspEnabled: false
    imagePullSecrets:
      - lxp-docker-registry-key

  alertmanager:
    enabled: true
    ingress:
      enabled: false
    alertmanagerSpec:
      image:
        registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
        repository: prometheus/alertmanager
      resources:
        limits:
          cpu: 200m
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 100Mi
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: lxp-default
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
    templateFiles:
      slack.tmpl: |-
        {{ define "status.icon" }}{{ if eq .Status "firing" }}{{ .Alerts.Firing | len }}:fire:{{ else if eq .Status "resolved" }}:heavy_check_mark:{{ else }}{{ .Status | toUpper }}{{ end }}{{ end }}
        {{ define "severity.icon" }}
          {{- if eq . "warning" -}}
            :warning:
          {{- else if eq . "error" -}}
            :heavy_exclamation_mark:
          {{- else -}}
            {{- . | toUpper -}}
          {{- end -}}
        {{ end }}
        {{ define "slack.emoji" }}{{ if eq .Status "firing" }}:fire:{{ else }}:unicorn_face:{{ end }}{{ end }}
        {{ define "slack.title" }}{{ template "severity.icon" .CommonLabels.severity }} {{ template "status.icon" . }} | {{ .GroupLabels.alertname }}{{ end }}

      pagerduty.tmpl: |-
        {{ define "pagerduty.description" }}{{ template "__subject" . }}{{ end }}
        {{ define "pagerduty.client" }}{{ template "__alertmanager" . }}{{ end }}
        {{ define "pagerduty.clientURL" }}{{ template "__alertmanagerURL" . }}{{ end }}
        {{ define "pagerduty.instances" }}{{ template "__text_alert_list" . }}{{ end }}

      email.tmpl: |-
        {{- define "email.subject" -}}
            LeapXpert FMOP - Alerts - {{ if eq .Status "firing" }}{{ .Alerts.Firing | len }} 🔥{{ end }} - {{ .GroupLabels.alertname }}
        {{- end -}}
        {{ define "email.html" }}
        <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
        <html xmlns="http://www.w3.org/1999/xhtml" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
        <head>
        <meta name="viewport" content="width=device-width">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>{{ template "__subject" . }}</title>
        <style>
        @media only screen and (max-width: 640px) {
          body {
            padding: 0 !important;
          }

          h1,
        h2,
        h3,
        h4 {
            font-weight: 800 !important;
            margin: 20px 0 5px !important;
          }

          h1 {
            font-size: 22px !important;
          }

          h2 {
            font-size: 18px !important;
          }

          h3 {
            font-size: 16px !important;
          }

          .container {
            padding: 0 !important;
            width: 100% !important;
          }

          .content {
            padding: 0 !important;
          }

          .content-wrap {
            padding: 10px !important;
          }

          .invoice {
            width: 100% !important;
          }
        }
        </style>
        </head>

        <body itemscope itemtype="http://schema.org/EmailMessage" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: none; height: 100%; line-height: 1.6em; background-color: #f6f6f6; width: 100%;">

        <table class="body-wrap" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; background-color: #f6f6f6; width: 100%;" width="100%" bgcolor="#f6f6f6">
          <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
            <td style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top;" valign="top"></td>
            <td class="container" width="600" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; display: block; max-width: 600px; margin: 0 auto; clear: both;" valign="top" align="center">
              <img src="https://www.leap.expert/wp-content/uploads/2020/02/logo-1.png" />
            </td>
          </tr>
          <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
            <td style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top;" valign="top"></td>
            <td class="container" width="600" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; display: block; max-width: 600px; margin: 0 auto; clear: both;" valign="top">
              <div class="content" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; max-width: 600px; margin: 0 auto; display: block; padding: 20px;">
                <table class="main" width="100%" cellpadding="0" cellspacing="0" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; background-color: #fff; border: 1px solid #e9e9e9; border-radius: 3px;" bgcolor="#fff">
                  <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                    {{ if gt (len .Alerts.Firing) 0 }}
                    <td class="alert alert-warning" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; vertical-align: top; font-size: 16px; color: #fff; font-weight: 500; padding: 20px; text-align: center; border-radius: 3px 3px 0 0; background-color: #E6522C;" valign="top" align="center" bgcolor="#E6522C">
                    {{ else }}
                    </td><td class="alert alert-good" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; vertical-align: top; font-size: 16px; color: #fff; font-weight: 500; padding: 20px; text-align: center; border-radius: 3px 3px 0 0; background-color: #68B90F;" valign="top" align="center" bgcolor="#68B90F">
                    {{ end }}
                      {{ .Alerts | len }} alert{{ if gt (len .Alerts) 1 }}s{{ end }} for {{ range .GroupLabels.SortedPairs }}
                        {{ .Name }}={{ .Value }}
                      {{ end }}
                    </td>
                  </tr>
                  <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                    <td class="content-wrap" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 30px;" valign="top">
                      <table width="100%" cellpadding="0" cellspacing="0" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                        <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          <td class="content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 0 0 20px;" valign="top">
                            <a href="{{ template "__alertmanagerURL" . }}" class="btn-primary" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; text-decoration: none; color: #FFF; background-color: #348eda; border: solid #348eda; border-width: 10px 20px; line-height: 2em; font-weight: bold; text-align: center; cursor: pointer; display: inline-block; border-radius: 5px; text-transform: capitalize;">View in {{ template "__alertmanager" . }}</a>
                          </td>
                        </tr>
                        {{ if gt (len .Alerts.Firing) 0 }}
                        <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          <td class="content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 0 0 20px;" valign="top">
                            <strong style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">[{{ .Alerts.Firing | len }}] Firing</strong>
                          </td>
                        </tr>
                        {{ end }}
                        {{ range .Alerts.Firing }}
                        <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          <td class="content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 0 0 20px;" valign="top">
                            <strong style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">Labels</strong><br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                            {{ range .Labels.SortedPairs }}{{ .Name }} = {{ .Value }}<br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">{{ end }}
                            {{ if gt (len .Annotations) 0 }}<strong style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">Annotations</strong><br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">{{ end }}
                            {{ range .Annotations.SortedPairs }}{{ .Name }} = {{ .Value }}<br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">{{ end }}
                            <a href="{{ .GeneratorURL }}" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; color: #348eda; text-decoration: underline;">Source</a><br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          </td>
                        </tr>
                        {{ end }}

                        {{ if gt (len .Alerts.Resolved) 0 }}
                          {{ if gt (len .Alerts.Firing) 0 }}
                        <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          <td class="content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 0 0 20px;" valign="top">
                            <br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                            <hr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                            <br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          </td>
                        </tr>
                          {{ end }}
                        <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          <td class="content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 0 0 20px;" valign="top">
                            <strong style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">[{{ .Alerts.Resolved | len }}] Resolved</strong>
                          </td>
                        </tr>
                        {{ end }}
                        {{ range .Alerts.Resolved }}
                        <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          <td class="content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top; padding: 0 0 20px;" valign="top">
                            <strong style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">Labels</strong><br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                            {{ range .Labels.SortedPairs }}{{ .Name }} = {{ .Value }}<br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">{{ end }}
                            {{ if gt (len .Annotations) 0 }}<strong style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">Annotations</strong><br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">{{ end }}
                            {{ range .Annotations.SortedPairs }}{{ .Name }} = {{ .Value }}<br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">{{ end }}
                            <a href="{{ .GeneratorURL }}" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; color: #348eda; text-decoration: underline;">Source</a><br style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                          </td>
                        </tr>
                        {{ end }}
                      </table>
                    </td>
                  </tr>
                </table>

                <div class="footer" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; width: 100%; clear: both; color: #999; padding: 20px;">
                  <table width="100%" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                    <tr style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px;">
                      <td class="aligncenter content-block" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; vertical-align: top; padding: 0 0 20px; text-align: center; color: #999; font-size: 12px;" valign="top" align="center"><a href="{{ .ExternalURL }}" style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; text-decoration: underline; color: #999; font-size: 12px;">Sent by {{ template "__alertmanager" . }}</a></td>
                    </tr>
                  </table>
                </div></div>
            </td>
            <td style="margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; box-sizing: border-box; font-size: 14px; vertical-align: top;" valign="top"></td>
          </tr>
        </table>

        </body>
        </html>

        {{ end }}

  mimirRemoteWrite:
    enabled: false

  prometheusOperator:
    image:
      registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
      repository: prometheus-operator/prometheus-operator
    admissionWebhooks:
      patch:
        image:
          registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/registry.k8s.io
          repository: ingress-nginx/kube-webhook-certgen
          tag: v1.9.1
    prometheusConfigReloader:
      image:
        registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
        repository: prometheus-operator/prometheus-config-reloader
    resources:
      limits:
        cpu: 200m
        memory: 300Mi
      requests:
        cpu: 100m
        memory: 100Mi

  prometheus:
    enabled: true
    ingress:
      enabled: false
    prometheusSpec:
      enableRemoteWriteReceiver: true
      prometheusExternalLabelNameClear: true
      replicaExternalLabelNameClear: true
      enableFeatures:
        - no-default-scrape-port
      serviceMonitorSelector:
        matchLabels:
          observability: prometheus-operator
      podMonitorSelector:
        matchLabels:
          observability: prometheus-operator
      probeSelector:
        matchLabels:
          observability: prometheus-operator
      ruleSelector:
        matchLabels:
          observability: prometheus-operator
      image:
        registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
        repository: prometheus/prometheus
      resources:
        limits:
          cpu: 1
          memory: 5Gi
        requests:
          cpu: 100m
          memory: 2.5Gi
      awsNodeExporter: []
        # - accountId: '498691965545'
        #   region: ap-southeast-1
        #   accessKey: accessKey1
        #   secretKey: secretKey1
        # - accountId: '498691965546'
        #   region: ap-southeast-2
        #   accessKey: accessKey2
        #   secretKey: secretKey2
      dcNodeExporter: {}
        # basicAuth:
        #   username: example_user
        #   password: example_password
        # cluster: example_tenant_id
      certManager: {}
        # enabled: true
        # namespace: cert-manager

      retention: 7d
      paused: false
      shards: 1
      replicas: 1
      remoteWrite: []
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: lxp-default
            resources:
              requests:
                storage: 30Gi
      additionalScrapeConfigs: |
        - job_name: 'envoy-stats'
          metrics_path: /stats/prometheus
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: pod
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: app
            - source_labels: [__meta_kubernetes_pod_container_name]
              action: keep
              regex: istio-proxy
            - source_labels: [__meta_kubernetes_pod_label_app]
              action: drop
              regex: istio-ingressgateway|istio-egressgateway
            - source_labels: [__meta_kubernetes_pod_controller_kind]
              regex: job
              action: drop
            - source_labels: [__meta_kubernetes_pod_phase]
              regex: "Succeeded|Failed|Completed"
              action: "drop"
            - source_labels: [__address__]
              action: replace
              regex: ([^:]+):15090
              replacement: $1:15020
              target_label: __address__
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_leap_expert_version]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: lxp_version
            - source_labels: [__meta_kubernetes_pod_label_leap_expert_app]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: container
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: lettuce_command_(.*)
              target_label: __name__
              replacement: redis_lettuce_command_$1
            - source_labels: [__name__]
              regex: '(^envoy_.*|^service_http_.*)'
              action: drop
            - regex: "cluster"
              action: labeldrop
            {{- range $key, $value := .Values.whatsappCloudMonitor.errorCodes }}
            - source_labels: [container,status]
              separator: '@'
              regex: 'whatsapp-native-integration@{{ $key }}'
              target_label: status_name
              replacement: '{{ $value }}'
              action: replace
            {{- end }}
        {{- if .Values.whatsappMonitor.enabled }}
        {{- if eq (len .Values.whatsappMonitor.staticTargets) 0 }}
        - job_name: whatsapp-metrics
          kubernetes_sd_configs:
            - role: pod
          scheme: http
          metrics_path: /metrics
          params:
            format:
              - prometheus
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_container_name]
              regex: "whatsapp-api-proxy-sidecar"
              action: keep
            - source_labels: [__address__]
              action: replace
              target_label: __address__
              regex: (.+?)(:\d+)?
              replacement: $1:2080
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: app
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
              regex: (.*)-(\d+)
              replacement: $2
              target_label: number
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
              action: replace
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: (.*)
              target_label: __name__
              replacement: whatsapp_client_$1
        - job_name: whatsapp-app-stats
          kubernetes_sd_configs:
            - role: pod
          scheme: http
          metrics_path: /v1/stats/app
          params:
            format:
              - prometheus
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_container_name]
              regex: "whatsapp-api-proxy-sidecar"
              action: keep
            - source_labels: [__address__]
              action: replace
              target_label: __address__
              regex: (.+?)(:\d+)?
              replacement: $1:2080
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
              regex: (.*)-(\d+)
              replacement: $2
              target_label: number
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
              action: replace
          metric_relabel_configs:
            {{- range $key, $value := .Values.whatsappMonitor.errorCodes }}
            - source_labels: [result]
              regex: "{{ $key }}"
              replacement: "{{ $value }}"
              target_label: "error_name"
              action: "replace"
            - source_labels: [status]
              regex: "{{ $key }}"
              replacement: "{{ $value }}"
              target_label: "error_name"
              action: "replace"
            {{- end }}
            - source_labels: [__name__]
              regex: (.*)
              target_label: __name__
              replacement: whatsapp_client_$1
        - job_name: whatsapp-health
          kubernetes_sd_configs:
            - role: pod
          scheme: http
          metrics_path: /probe
          params:
            module: [ http_whatsapp_2xx ]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_container_name]
              regex: "whatsapp-api-proxy-sidecar"
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
              regex: (.*)-(\d+)
              replacement: $2
              target_label: number
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
              action: replace
            - source_labels: [__address__]
              regex: (.+)
              replacement: $1/v1/health
              target_label: __param_target
            - source_labels: [__address__]
              target_label: instance
            - target_label: __address__
              replacement: prometheus-blackbox-exporter:9115
            - source_labels: [__param_module]
              target_label: module
            - action: replace
              target_label: app
              replacement: whatsapp-client
        {{- else }}
        {{- with .Values.whatsappMonitor.staticTargets }}
        - job_name: whatsapp-metrics
          static_configs:
            - targets:
              {{- range . }}
              - {{ . }}
              {{- end }}
          scheme: http
          metrics_path: /metrics
          params:
            format:
              - prometheus
          relabel_configs:
            - source_labels: [__address__]
              regex: (.+?)-(\d+)(.+?)
              replacement: $2
              target_label: number
              action: replace
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: (.*)
              target_label: __name__
              replacement: whatsapp_client_$1
        - job_name: whatsapp-app-stats
          static_configs:
            - targets:
              {{- range . }}
              - {{ . }}
              {{- end }}
          scheme: http
          metrics_path: /v1/app/stats
          params:
            format:
              - prometheus
          relabel_configs:
            - source_labels: [__address__]
              regex: (.+?)-(\d+)(.+?)
              replacement: $2
              target_label: number
              action: replace
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: (.*)
              target_label: __name__
              replacement: whatsapp_client_$1
        - job_name: whatsapp-health
          static_configs:
            - targets:
              {{- range . }}
              - {{ . }}
              {{- end }}
          scheme: http
          metrics_path: /probe
          params:
            module: [ http_whatsapp_2xx ]
          relabel_configs:
            - source_labels: [__address__]
              regex: (.+?)-(\d+)(.+?)
              replacement: $2
              target_label: number
              action: replace
            - source_labels: [__address__]
              regex: (.+)
              replacement: $1/v1/health
              target_label: __param_target
            - source_labels: [__address__]
              target_label: instance
            - target_label: __address__
              replacement: prometheus-blackbox-exporter:9115
            - source_labels: [__param_module]
              target_label: module
            - action: replace
              target_label: app
              replacement: whatsapp-client
        {{- end }}
        {{- end }}
        {{- end }}

        {{- with .Values.prometheus.prometheusSpec.awsNodeExporter }}
        {{- range . }}
        - job_name: node-exporter-ec2-{{ .accountId }}
          ec2_sd_configs:
            - region: {{ .region }}
              access_key: {{ .accessKey }}
              secret_key: {{ .secretKey }}
              refresh_interval: 300s
              port: 9100
              filters:
                - name: tag:imessage
                  values:
                    - 'true'
          relabel_configs:
            - target_label: 'sysname'
              replacement: 'Darwin'
            - target_label: 'aws_account_id'
              replacement: '{{ .accountId }}'
            - source_labels: [job]
              target_label: job
              replacement: 'node-exporter'
            - source_labels: [__meta_ec2_instance_id]
              target_label: instance
              replacement: '${1}'
              action: replace
            - source_labels: [__meta_ec2_region]
              target_label: region
              replacement: '${1}'
              action: replace
            - source_labels: [__meta_ec2_public_ip]
              target_label: public_ip
              replacement: '${1}'
              action: replace
            - source_labels: [__meta_ec2_tag_Name]
              target_label: domain
              replacement: '${1}'
              action: replace
            - source_labels: [public_ip]
              target_label: __address__
              regex: (.*)
              replacement: '${1}:9100'
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(^promhttp_.*|^go_.*)'
              action: drop
        - job_name: igateway-stats-ec2-{{ .accountId }}
          scheme: https
          ec2_sd_configs:
            - region: {{ .region }}
              access_key: {{ .accessKey }}
              secret_key: {{ .secretKey }}
              refresh_interval: 300s
              port: 9100
              filters:
                - name: tag:imessage
                  values:
                    - 'true'
          tls_config:
            insecure_skip_verify: true
          relabel_configs:
            - source_labels: [__meta_ec2_tag_Name]
              target_label: __address__
              regex: (.*)
            - source_labels: [__meta_ec2_tag_Name]
              regex: (.*)
              target_label: domain
              replacement: '$1'
            - action: replace
              target_label: app
              replacement: imessage-archiving-gateway
        - job_name: igateway-probe-ec2-{{ .accountId }}
          scheme: http
          ec2_sd_configs:
            - region: {{ .region }}
              access_key: {{ .accessKey }}
              secret_key: {{ .secretKey }}
              refresh_interval: 300s
              port: 9100
              filters:
                - name: tag:imessage
                  values:
                    - 'true'
          metrics_path: /probe
          params:
            module: [ http_2xx_3xx_4xx ]
          relabel_configs:
            - source_labels: [__meta_ec2_tag_Name]
              target_label: __address__
              regex: (.*)
            - source_labels: [__address__]
              target_label: domain
              regex: (.*)
            - source_labels: [domain]
              regex: (.+)
              replacement: https://$1/imessage/v1/secure-ping
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: target
            - target_label: __address__
              replacement: prometheus-blackbox-exporter:9115
            - source_labels: [__address__]
              target_label: instance
            - source_labels: [__param_module]
              target_label: module
            - action: replace
              target_label: app
              replacement: imessage-archiving-gateway
        {{- end }}
        {{- end }}

        - job_name: fmop-be-readiness-check
          kubernetes_sd_configs:
            - role: service
          scheme: http
          metrics_path: /probe
          params:
            module: [ http_2xx_3xx_4xx ]
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: app
            - source_labels: [__meta_kubernetes_service_label_leap_expert_product]
              action: keep
            - source_labels: [__meta_kubernetes_service_label_leap_expert_language]
              regex: 'golang|java|quarkus'
              action: keep
            - source_labels: [__meta_kubernetes_service_label_leap_expert_subsystem]
              regex: 'backend'
              action: keep
            - source_labels: [__meta_kubernetes_service_port_name]
              regex: 'platform'
              action: keep
            - source_labels: [__meta_kubernetes_service_label_leap_expert_product]
              regex: 'fmop'
              action: keep
            - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace, __meta_kubernetes_service_port_number]
              separator: .
              target_label: __address__
              regex: "(.*).(.*):(.*)"
              replacement: '${1}.${2}:${3}'
              action: replace
            - source_labels: [__address__]
              regex: (.+)
              replacement: $1/readiness
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: target
            - target_label: __address__
              replacement: prometheus-blackbox-exporter:9115
            - source_labels: [__address__]
              target_label: instance
            - source_labels: [__param_module]
              target_label: module

        - job_name: voip-be-readiness-check
          kubernetes_sd_configs:
            - role: service
          scheme: http
          metrics_path: /probe
          params:
            module: [ http_2xx_3xx_4xx ]
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: app
            - source_labels: [__meta_kubernetes_service_name]
              regex: '(^voip-mgr.*)'
              action: drop
            - source_labels: [__meta_kubernetes_service_label_leap_expert_product]
              action: keep
            - source_labels: [__meta_kubernetes_service_label_leap_expert_language]
              regex: 'golang|java|quarkus'
              action: keep
            - source_labels: [__meta_kubernetes_service_label_leap_expert_subsystem]
              regex: 'backend'
              action: keep
            - source_labels: [__meta_kubernetes_service_port_name]
              regex: 'platform'
              action: keep
            - source_labels: [__meta_kubernetes_service_label_leap_expert_product]
              regex: 'voip'
              action: keep
            - source_labels: [__address__]
              action: replace
              regex: ([^:]+):10080
              replacement: $1:8081 # voice and cic readiness check port
              target_label: __address__
            - source_labels: [__address__]
              regex: (.+)
              replacement: $1/healthcheck
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: target
            - target_label: __address__
              replacement: prometheus-blackbox-exporter:9115
            - source_labels: [__address__]
              target_label: instance
            - source_labels: [__param_module]
              target_label: module

        {{- with .Values.prometheus.prometheusSpec.dcNodeExporter }}
        - job_name: node-exporter-dc-{{ .cluster }}
          scheme: http
          http_sd_configs:
            - url: https://dcsd.obs.leapxpert.io/{{ .cluster }}
              basic_auth:
                username: {{ .basicAuth.username }}
                password: {{ .basicAuth.password }}
          relabel_configs:
            - target_label: 'sysname'
              replacement: 'Darwin'
            - source_labels: [job]
              target_label: job
              replacement: 'node-exporter'
            - source_labels: [__address__]
              target_label: domain
              regex: (.*)
            - source_labels: [domain]
              target_label: __address__
              regex: (.*)
              replacement: '${1}:9100'
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(^promhttp_.*|^go_.*)'
              action: drop
        - job_name: igateway-probe-dc-{{ .cluster }}
          scheme: http
          metrics_path: /probe
          params:
            module: [ http_2xx_3xx_4xx ]
          http_sd_configs:
            - url: https://dcsd.obs.leapxpert.io/{{ .cluster }}
              basic_auth:
                username: {{ .basicAuth.username }}
                password: {{ .basicAuth.password }}
          relabel_configs:
            - source_labels: [__address__]
              target_label: domain
              regex: (.*)
            - source_labels: [domain]
              regex: (.+)
              replacement: https://$1/imessage/v1/secure-ping
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: target
            - target_label: __address__
              replacement: prometheus-blackbox-exporter:9115
            - source_labels: [__address__]
              target_label: instance
            - source_labels: [__param_module]
              target_label: module
            - action: replace
              target_label: app
              replacement: imessage-archiving-gateway
        - job_name: igateway-stats-dc-{{ .cluster }}
          scheme: https
          http_sd_configs:
            - url: https://dcsd.obs.leapxpert.io/{{ .cluster }}
              basic_auth:
                username: {{ .basicAuth.username }}
                password: {{ .basicAuth.password }}
          tls_config:
            insecure_skip_verify: true
          relabel_configs:
            - target_label: 'sysname'
              replacement: 'Darwin'
            - source_labels: [__address__]
              target_label: domain
              regex: (.*)
        {{- end }}

        {{- with .Values.prometheus.prometheusSpec.certManager }}
        - job_name: cert-manager
          scheme: http
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - {{ .namespace }}
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: replace
              replacement: $1
              regex: (.*)
              target_label: app
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              separator: ;
              regex: "9402"
              replacement: $1
              action: keep
            - source_labels: [__meta_kubernetes_namespace]
              separator: ;
              regex: (.*)
              target_label: namespace
              replacement: $1
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              separator: ;
              regex: (.*)
              target_label: pod
              replacement: $1
              action: replace
            - source_labels: [__meta_kubernetes_pod_container_name]
              separator: ;
              regex: (.*)
              target_label: container
              replacement: $1
              action: replace
        {{- end }}

        {{- with .Values.prometheus.prometheusSpec.additionalScrapeConfigAppendix }}
        {{ tpl . $ }}
        {{- end }}
  # Ref. https://helm.sh/docs/chart_template_guide/control_structures/#modifying-scope-using-with

  grafana:
    enabled: true
    image:
      registry: leapxpert.azurecr.io/public/leapxpert/thirdparties
      tag: 9.5.2
    downloadDashboardsImage:
      repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/curlimages/curl
    initChownData:
      image:
        registry: leapxpert.azurecr.io/public/leapxpert/thirdparties
        repository: busybox
        tag: "1.34.0"
    defaultDashboardsEnabled: true
    adminPassword: ""
    useStatefulSet: true
    testFramework:
      enabled: false
    rbac:
      pspEnabled: false
    grafana.ini:
      unified_alerting:
        enabled: true
      alerting:
        enabled: false
      plugins:
        enable_alpha: true
    sidecar:
      image:
        registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
        tag: 1.25.3
      dashboards:
        enabled: true
        label: grafana_dashboard
    persistence:
      enabled: true
      type: statefulset
      storageClassName: lxp-default
    imageRenderer:
      enabled: false
      image:
        registry: leapxpert.azurecr.io/public/leapxpert/thirdparties
        tag: 3.8.4
        pullSecrets:
          - lxp-docker-registry-key
    resources:
      limits:
        cpu: 100m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 100Mi
    istio:
      ingressNamespace: default

  kube-state-metrics:
    image:
      registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/registry.k8s.io
    podSecurityPolicy:
      enabled: false
    prometheus:
      monitor:
        additionalLabels:
          observability: prometheus-operator
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            separator: ;
            regex: (.*)
            targetLabel: node
            replacement: $1
            action: replace
    resources:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 100m
        memory: 100Mi

  prometheus-node-exporter:
    image:
      registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/quay.io
    prometheus:
      monitor:
        metricRelabelings:
        # Drop node metrics in the top 30 list
        - sourceLabels: [__name__]
          regex: '(node_filesystem_device_error)'
          action: drop
        additionalLabels:
          observability: prometheus-operator
    resources:
      limits:
        cpu: 200m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 30Mi
