        - whatsappnativeintegration
        - usermanagement
        - wechatminiappintegration
        - voiceintegration
        - proxymessaging
      duration: 15m
      matchedThreshold: 10
      excludeThreshold: null
    - topics:
        - proxymessaging
        - audit
        - notification
        - realtimesync
        - report-management
        - wechatintegration
        - lineintegration
        - signal
        - sms
        - wechatminiappintegration
        - whatsappnative
        - teams2bintegration
        - slack2bintegration
        - usermanagement
        - events-api
        - chatbot
        - voice-integration-local
        - message-tracking
        - wecomintegration
        - whatapparchived
        - search
        - analytics
        - authentication
        - default
        - poolmanagement
        - room-conditions
        - imessagearchived
        - sms2bintegration
      consumerGroups: []
      duration: 15m
      matchedThreshold: 50
      excludeThreshold: null
    - topics:
        - usermanagement
        - proxymessaging
        - message-tracking
      consumerGroups: []
      duration: 15m
      matchedThreshold: 100
      excludeThreshold: null
    - topics:
        - molap-audit-aggregation
      consumerGroups: []
      duration: 15m
      matchedThreshold: 1500
      excludeThreshold: null
    - topics:
        - molap-audit-migration
        - molap-audit-source
        - molap-audit-failed-aggregate
      consumerGroups: []
      duration: 15m
      matchedThreshold: 3000
      excludeThreshold: null
    - topics:
        - incoming-message-passive-imessage
      consumerGroups: []
      duration: 30m
      matchedThreshold: 1000
      excludeThreshold: null
# ---------------------------------------------
loki:
  enabled: true

  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    resources:
      limits:
        cpu: 1000m
        memory: 3Gi
      requests:
        cpu: 100m
        memory: 1.5Gi
    extraVolumes:
      - name: lokirules
        emptyDir: {}
    extraVolumeMounts:
      - name: lokirules
        mountPath: /rules

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  gateway:
    enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  imagePullSecrets:
    - name: lxp-docker-registry-key
  rbac:
    pspEnabled: false
  serviceMonitor:
    enabled: true

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: 2024-06-19
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    image:
      registry: leapxpert.azurecr.io
      repository: public/leapxpert/thirdparties/grafana/loki
# ---------------------------------------------
grafanaAgent:
  enabled: true
# ---------------------------------------------
grafana-agent:
  image:
    registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/docker.io
    pullSecrets:
      - name: lxp-docker-registry-key
  crds:
    create: false
  agent:
    common:
      hideSecret:
        enabled: false
    static:
      daemonset:
        enabled: true
        mode: static
        extraArgs:
          - -enable-features=integrations-next
          - -config.expand-env=true
        extraPorts:
          - name: otlp-grpc
            port: 4317
            targetPort: 4317
            protocol: TCP
          - name: zipkin
            port: 9411
            targetPort: 9411
            protocol: TCP
          - name: app-agent
            port: 12347
            targetPort: 12347
            protocol: TCP
          - name: syslog
            port: 1514
            targetPort: 1514
            protocol: TCP
        volumes:
          extra:
            - name: queue-volume
              hostPath:
                path: /tmp/agent
        mounts:
          varlog: true
          extra:
            - name: queue-volume
              mountPath: /tmp/agent
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        logsClientsConfig:
          enabled: true
          remoteWriteConfig: []
          additionalLogsConfigs: []
        tracesClientsConfig:
          enabled: true
          remoteWriteConfig: []
          additionalTracesReceiverConfigs: {}
        metricsClientsConfig:
          enabled: false
        integrationsConfig:
          frontendMonitoring:
            enabled: false
            corsAllowedOrigins: []
            rateLimiting: {}
            istioIngress:
              namespace: ""
              domains: []
          additionalIntegrationsConfigs: {}
        configMap:
          create: true
          content: |-
            server:
              log_level: info
              log_format: logfmt
            {{- if .Values.agent.static.daemonset.logsClientsConfig.enabled }}
            logs:
              positions_directory: /tmp/agent/positions.yaml
              configs:
                - name: default
                  {{- if not .Values.agent.common.hideSecret.enabled }}
                  clients: {{ toYaml .Values.agent.static.daemonset.logsClientsConfig.remoteWriteConfig | nindent 8 }}
                  {{- else }}
                  clients:
                    - url: https://logging.obs.leapxpert.io/loki/api/v1/push
                      tenant_id: ${CENTRAL_OBS_TENANT_ID}
                      external_labels:
                        cluster: ${CENTRAL_OBS_TENANT_ID}
                      basic_auth:
                        username: ${CENTRAL_OBS_LOG_USER}
                        password: ${CENTRAL_OBS_LOG_PASSWORD}
                  {{- end }}
                  limits_config:
                  scrape_configs:
                    - job_name: kubernetes-pods
                      pipeline_stages:
                        - cri: {}
                        - match:
                            selector: '{product=~"fmop|maxen|voip"}'
                            stages:
                            - json:
                                expressions:
                                  level: level
                            - replace:
                                expression: "(\\w+)"
                                source: "level"
                                replace: '{{`{{`}} .Value | ToUpper {{`}}`}}'
                            - replace:
                                expression: "(WARNING|warning)"
                                source: "level"
                                replace: 'WARN'
                            - labels:
                                level: null
                            - metrics:
                                fmop_logs_by_level:
                                  type: Counter
                                  description: "The number of logs lines by level"
                                  source: level
                                  max_idle_duration: 30m
                                  config:
                                    match_all: true
                                    action: inc
                            - match:
                                selector: '{product=~"fmop|maxen|voip",language=~"java|quarkus"} |~ "[a-zA-Z$0-9]+Exception"'
                                stages:
                                - json:
                                    expressions:
                                      exception: exception
                                - regex:
                                    expression: "(?P<exception_name>[a-zA-Z$0-9]+Exception)"
                                    source: exception
                                - labels:
                                    exception_name: null
                                - metrics:
                                    fmop_logs_by_exception_java:
                                      type: Counter
                                      description: "The number of logs lines by exception"
                                      source: exception_name
                                      max_idle_duration: 30m
                                      config:
                                        match_all: true
                                        action: inc
                      kubernetes_sd_configs:
                        - role: pod
                      relabel_configs:
                        - source_labels:
                            - __meta_kubernetes_pod_controller_name
                          regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
                          action: replace
                          target_label: __tmp_controller_name
                        - source_labels:
                            - __meta_kubernetes_pod_label_app_kubernetes_io_name
                            - __meta_kubernetes_pod_label_app
                            - __tmp_controller_name
                            - __meta_kubernetes_pod_name
                          regex: ^;*([^;]+)(;.*)?$
                          action: replace
                          target_label: app
                        - source_labels:
                            - __meta_kubernetes_pod_label_app_kubernetes_io_instance
                            - __meta_kubernetes_pod_label_release
                          regex: ^;*([^;]+)(;.*)?$
                          action: replace
                          target_label: instance
                        - source_labels:
                            - __meta_kubernetes_pod_label_app_kubernetes_io_component
                            - __meta_kubernetes_pod_label_component
                          regex: ^;*([^;]+)(;.*)?$
                          action: replace
                          target_label: component
                        - action: replace
                          source_labels:
                          - __meta_kubernetes_pod_node_name
                          target_label: node_name
                        - action: replace
                          source_labels:
                          - __meta_kubernetes_namespace
                          target_label: namespace
                        - action: replace
                          replacement: $1
                          separator: /
                          source_labels:
                          - namespace
                          - app
                          target_label: job
                        - action: replace
                          source_labels:
                          - __meta_kubernetes_pod_name
                          target_label: pod
                        - action: replace
                          source_labels:
                          - __meta_kubernetes_pod_container_name
                          target_label: container
                        - action: replace
                          replacement: /var/log/pods/*$1/*.log
                          separator: /
                          source_labels:
                          - __meta_kubernetes_pod_uid
                          - __meta_kubernetes_pod_container_name
                          target_label: __path__
                        - action: replace
                          regex: true/(.*)
                          replacement: /var/log/pods/*$1/*.log
                          separator: /
                          source_labels:
                          - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
                          - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
                          - __meta_kubernetes_pod_container_name
                          target_label: __path__
                        - action: labelmap
                          regex: __meta_kubernetes_pod_label_leap_expert_(.+)
                {{- with .Values.agent.static.daemonset.logsClientsConfig.additionalLogsConfigs }}
                {{- toYaml . | nindent 8 }}
                {{- end -}}
            {{- end -}}
            {{- if .Values.agent.static.daemonset.tracesClientsConfig.enabled }}
            traces:
              configs:
                - name: default
                  batch: {}
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                          endpoint: 0.0.0.0:4317
                        http:
                          endpoint: 0.0.0.0:4318
                    zipkin:
                      endpoint: 0.0.0.0:9411
                    {{- with .Values.agent.static.daemonset.tracesClientsConfig.additionalTracesReceiverConfigs }}
                    {{- toYaml . | nindent 8 }}
                    {{- end }}
                  {{- if not .Values.agent.common.hideSecret.enabled }}
                  remote_write: {{ toYaml .Values.agent.static.daemonset.tracesClientsConfig.remoteWriteConfig | nindent 8 }}
                  {{- else }}
                  remote_write:
                    - endpoint: tracing-write.obs.leapxpert.io:443
                      headers:
                        x-scope-orgid: ${CENTRAL_OBS_TENANT_ID}
                        authorization: Basic ${CENTRAL_OBS_TRACE_SECRET}
                      sending_queue:
                        num_consumers: 10
                        queue_size: 5000
                      retry_on_failure:
                        enabled: true
                        initial_interval: 10s
                        max_interval: 60s
                        max_elapsed_time: 10m
                  {{- end }}
                  service_graphs:
                    enabled: true
                  tail_sampling:
                    policies:
                      - name: drop_noisy_traces_by_user_agent_original
                        type: string_attribute
                        string_attribute:
                          key: user_agent.original
                          values:
                            - ^(Blackbox Exporter\/.*)$
                            - ^(kube-probe\/.*)$
                            - ^(Prometheus\/.*)$
                            - ^(OTel-OTLP-Exporter-Java\/.*)$
                            - ^(FreshpingBot\/.*)$
                          enabled_regex_matching: true
                          invert_match: true
                      - name: drop_noisy_traces_by_user_agent
                        type: string_attribute
                        string_attribute:
                          key: user_agent
                          values:
                            - ^(Blackbox Exporter\/.*)$
                            - ^(kube-probe\/.*)$
                            - ^(Prometheus\/.*)$
                            - ^(OTel-OTLP-Exporter-Java\/.*)$
                            - ^(FreshpingBot\/.*)$
                          enabled_regex_matching: true
                          invert_match: true
                      - name: drop_noisy_traces_by_http_url
                        type: string_attribute
                        string_attribute:
                          key: http.url
                          values:
                            - ^(https:\/\/.+\/_matrix\/client\/.+\/sync.*)$
                            - ^(http:\/\/zipkin\/.*)$
                          enabled_regex_matching: true
                          invert_match: true
            {{- end -}}
            {{- if .Values.agent.static.daemonset.metricsClientsConfig.enabled }}
            metrics:
              wal_directory: /tmp/wal
              global:
                scrape_interval: 30s
                scrape_timeout: 30s
                external_labels:
                  component: faro
              configs:
                - name: default
                  remote_write:
                    - url: http://kube-prometheus-stack-prometheus.{{ .Release.Namespace }}:9090/api/v1/write
            {{- end }}
            integrations:
            {{- if .Values.agent.static.daemonset.integrationsConfig.frontendMonitoring.enabled }}
            {{- with .Values.agent.static.daemonset.integrationsConfig.frontendMonitoring }}
              app_agent_receiver_configs:
                - autoscrape:
                    enable: true
                    metrics_instance: default
                  instance: frontend
                  logs_instance: default
                  traces_instance: default
                  server:
                    host: 0.0.0.0
                    port: 12347
                    api_key: ${CENTRAL_OBS_FARO_API_KEY}
                    cors_allowed_origins:
                    {{- toYaml .corsAllowedOrigins | nindent 10 }}
                    rate_limiting: {{ toYaml .rateLimiting | nindent 10 }}
                  logs_labels:
                    component: faro
                    app_name: ''
                    kind: ''
                  logs_send_timeout: 5000
                  sourcemaps:
                    download: true
            {{- end }}
            {{- end }}
            {{- with .Values.agent.static.daemonset.integrationsConfig.additionalIntegrationsConfigs }}
            {{- toYaml . | nindent 2 }}
            {{- end -}}

      statefulset:
        enabled: true
        mode: static
        extraArgs:
          - -enable-features=integrations-next
          - -config.expand-env=true
        logsClientsConfig:
          remoteWriteConfig: []
        snmpMonitoring:
          enabled: false
          config:
            snmpTargets: []
        resources:
          limits:
            cpu: 50m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 128Mi
        configMap:
          create: true
          content: |
            server:
              log_level: info

            integrations:
              eventhandler:
                cache_path: "/etc/eventhandler/eventhandler.cache"
              {{- if .Values.agent.static.statefulset.snmpMonitoring.enabled }}
              snmp:
                config_file: /tmp/secret/snmp.yaml
                snmp_targets: {{- toYaml .Values.agent.static.statefulset.snmpMonitoring.config.snmpTargets | nindent 6 }}
                walk_params:
                  private:
                    retries: 3
                    timeout: 60s
              {{- end }}
            logs:
              positions_directory: /data/agent/positions.yaml
              configs:
              - name: default
                {{- if not .Values.agent.common.hideSecret.enabled }}
                clients: {{ toYaml .Values.agent.static.statefulset.logsClientsConfig.remoteWriteConfig | nindent 8 }}
                {{- else }}
                clients:
                  - url: https://logging.obs.leapxpert.io/loki/api/v1/push
                    tenant_id: ${CENTRAL_OBS_TENANT_ID}
                    external_labels:
                      cluster: ${CENTRAL_OBS_TENANT_ID}
                    basic_auth:
                      username: ${CENTRAL_OBS_LOG_USER}
                      password: ${CENTRAL_OBS_LOG_PASSWORD}
                {{- end }}

            {{- if .Values.agent.static.statefulset.snmpMonitoring.enabled }}
            metrics:
              global:
                scrape_interval: 60s
                scrape_timeout: 60s
                external_labels:
                  app: voip-sbc
                  component: snmp
              configs:
                - name: default
                  remote_write:
                    - url: http://kube-prometheus-stack-prometheus.{{ .Release.Namespace }}:9090/api/v1/write
            {{- end }}
        mounts:
          extra:
            - name: data
              mountPath: /data
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes: [ "ReadWriteOnce" ]
              storageClassName: "lxp-default"
              resources:
                requests:
                  storage: 1Gi

    flow:
      daemonset:
        enabled: true
        extraArgs:
          - --config.extra-args="-enable-features=integrations-next -config.expand-env"
        hostPID: true
        securityContext:
          privileged: true
          runAsGroup: 0
          runAsUser: 0
        nodeSelector:
          kubernetes.io/os: replace_me
        clustering:
          enabled: true
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 128Mi
        extraEnv:
          - name: LEAPXPERT_EXCLUDED_JAVA_APPS
            value: "wecomintegration"
          - name: LEAPXPERT_INCLUDED_JAVA_APPS
            value: "*"
          - name: LEAPXPERT_EXCLUDED_GOLANG_APPS
            value: null
          - name: LEAPXPERT_INCLUDED_GOLANG_APPS
            value: "*"
        configMap:
          create: true
          content: |-
            logging {
              level  = "info"
              format = "logfmt"
            }

            discovery.kubernetes "local_pods" {
              selectors {
                field = "spec.nodeName=" + env("HOSTNAME")
                role = "pod"
              }
              role = "pod"
            }

            discovery.process "all" {
              join = discovery.kubernetes.local_pods.targets
            }

            discovery.relabel "java_pods" {
              targets = discovery.process.all.targets

              // Filter out all non-java processes
              rule {
                action = "keep"
                regex = "^(.*/java)$"
                source_labels = ["__meta_process_exe"]
              }

              // Drop all pods that are not in Running state
              rule {
                action = "drop"
                regex = "Succeeded|Failed|Completed"
                source_labels = ["__meta_kubernetes_pod_phase"]
              }

              // Drop all pods that have workload type job
              rule {
                action = "drop"
                regex = "job"
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_workload_type"]
              }

              // Collect profile from services with leap.expert/product=fmop label
              rule {
                action = "keep"
                regex = "fmop"
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_product"]
              }

              // Collect profile from services with leap.expert/language=java label
              rule {
                action = "keep"
                regex = "java"
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_language"]
              }

              // Drop profile from services with leap.expert/app=<app_name> label
              rule {
                action = "drop"
                regex = env("LEAPXPERT_EXCLUDED_JAVA_APPS")
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_app"]
              }

              // Collect profile from services with leap.expert/product=fmop label
              rule {
                action = "keep"
                regex = env("LEAPXPERT_INCLUDED_JAVA_APPS")
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_app"]
              }

              // Extract label namespace
              rule {
                action = "replace"
                target_label = "namespace"
                source_labels = ["__meta_kubernetes_namespace"]
              }

              // Extract label pod
              rule {
                action = "replace"
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label = "pod"
              }

              // Extract label node
              rule {
                action = "replace"
                source_labels = ["__meta_kubernetes_pod_node_name"]
                target_label = "node"
              }

              // Extract label container
              rule {
                action = "replace"
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label = "container"
              }

              // Provide arbitrary service_name label, otherwise it will be inferred from discovery labels automatically
              rule {
                action = "replace"
                regex = "(.*)@(.*)"
                replacement = "java/${1}/${2}"
                separator = "@"
                source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                target_label = "service_name"
              }
            }

            pyroscope.java "java" {
              targets = discovery.relabel.java_pods.output
              forward_to = [pyroscope.write.endpoint.receiver]
            }

            discovery.relabel "golang_pods" {
              targets = discovery.process.all.targets

              // Drop all pods that are not in Running state
              rule {
                action = "drop"
                regex = "Succeeded|Failed|Completed"
                source_labels = ["__meta_kubernetes_pod_phase"]
              }

              // Drop all pods that have workload type job
              rule {
                action = "drop"
                regex = "job"
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_workload_type"]
              }

              // Collect profile from services with leap.expert/product=fmop label
              rule {
                action = "keep"
                regex = "fmop"
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_product"]
              }

              // Collect profile from services with leap.expert/language=golang label
              rule {
                action = "keep"
                regex = "golang"
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_language"]
              }

              // Drop profile from services with leap.expert/app=<app_name> label
              rule {
                action = "drop"
                regex = env("LEAPXPERT_EXCLUDED_GOLANG_APPS")
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_app"]
              }

              // Collect profile from services with leap.expert/product=fmop label
              rule {
                action = "keep"
                regex = env("LEAPXPERT_INCLUDED_GOLANG_APPS")
                source_labels = ["__meta_kubernetes_pod_label_leap_expert_app"]
              }

              // Extract label namespace
              rule {
                action = "replace"
                target_label = "namespace"
                source_labels = ["__meta_kubernetes_namespace"]
              }

              // Extract label pod
              rule {
                action = "replace"
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label = "pod"
              }

              // Extract label node
              rule {
                action = "replace"
                source_labels = ["__meta_kubernetes_pod_node_name"]
                target_label = "node"
              }

              // Extract label container
              rule {
                action = "replace"
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label = "container"
              }

              // Provide arbitrary service_name label, otherwise it will be inferred from discovery labels automatically
              rule {
                action = "replace"
                regex = "(.*)@(.*)"
                replacement = "golang/${1}/${2}"
                separator = "@"
                source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                target_label = "service_name"
              }
            }

            pyroscope.scrape "golang" {
              targets = discovery.relabel.golang_pods.output
              forward_to = [pyroscope.write.endpoint.receiver]
            }

            {{- if not .Values.agent.common.hideSecret.enabled }}
            {{- with .Values.agent.flow.daemonset.pyroScopeClientsConfig }}
            pyroscope.write "endpoint" {
              endpoint {
                basic_auth {
                  password = "{{ .password }}"
                  username = "{{ .username }}"
                }
                headers = {
                  "X-Scope-OrgID" = "{{ .cluster }}",
                }
                url = "https://profiling.obs.leapxpert.io"
              }
              external_labels = {
                "cluster" = "{{ .cluster }}",
              }
            }
            {{- end }}
            {{- else }}
            pyroscope.write "endpoint" {
              endpoint {
                basic_auth {
                  username = env("CENTRAL_OBS_PROFILE_USER")
                  password = env("CENTRAL_OBS_PROFILE_PASSWORD")
                }
                headers = {
                  "X-Scope-OrgID" = env("CENTRAL_OBS_TENANT_ID"),
                }
                url = "https://profiling.obs.leapxpert.io"
              }
              external_labels = {
                "cluster" = env("CENTRAL_OBS_TENANT_ID"),
              }
            }
            {{- end }}
  service:
    static:
      daemonset:
        enabled: true
    flow:
      daemonset:
        enabled: true
  serviceMonitor:
    static:
      daemonset:
        enabled: true
        additionalLabels:
          observability: prometheus-operator
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            replacement: $1
            regex: (.*)
            targetLabel: app
        metricRelabelings:
          - action: replace
            sourceLabels:
              - path
            regex: '/var/log/pods/([a-zA-Z0-9-]+)_([a-zA-Z0-9-]+)_[a-f0-9-]+/([a-zA-Z0-9-]+)/.*.log'
            replacement: '$1'
            targetLabel: exported_namespace
          - action: replace
            sourceLabels:
              - path
            regex: '/var/log/pods/([a-zA-Z0-9-]+)_([a-zA-Z0-9-]+)_[a-f0-9-]+/([a-zA-Z0-9-]+)/.*.log'
            replacement: '$2'
            targetLabel: exported_pod
          - action: replace
            sourceLabels:
              - path
            regex: '/var/log/pods/([a-zA-Z0-9-]+)_([a-zA-Z0-9-]+)_[a-f0-9-]+/([a-zA-Z0-9-]+)/.*.log'
            replacement: '$3'
            targetLabel: exported_container
          - action: replace
            sourceLabels:
              - level
            regex: 'warning|WARNING|warn'
            replacement: 'WARN'
            targetLabel: level
          - action: replace
            sourceLabels:
              - level
            regex: 'info'
            replacement: 'INFO'
            targetLabel: level
          - action: replace
            sourceLabels:
              - level
            regex: 'debug'
            replacement: 'DEBUG'
            targetLabel: level
          - action: replace
            sourceLabels:
              - level
            regex: 'error'
            replacement: 'ERROR'
            targetLabel: level
      statefulset:
        additionalLabels:
          observability: prometheus-operator
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            replacement: $1
            regex: (.*)
            targetLabel: app
# ---------------------------------------------
lokiLegacy:
  enabled: false
# ---------------------------------------------
loki-legacy:
  enabled: false
  image:
    repository: leapxpert.azurecr.io/public/leapxpert/thirdparties/grafana/loki
    pullSecrets:
      - lxp-docker-registry-key
  fullnameOverride: observability-loki
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 100m
