# ---------------------------------------------
promtail:
  enabled: true
  image:
    registry: leapxpert.azurecr.io/public/leapxpert/thirdparties/docker.io
  imagePullSecrets:
    - name: lxp-docker-registry-key
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  rbac:
    pspEnabled: false
  config:
    snippets:
      pipelineStages:
        - cri: {}
        - match:
            selector: '{product=~"fmop|maxen|voip"}'
            stages:
              - json:
                  expressions:
                    level: level
              - replace:
                  expression: "(\\w+)"
                  source: "level"
                  replace: '{{`{{`}} .Value | ToUpper {{`}}`}}'
              - replace:
                  expression: "(WARNING|warning)"
                  source: "level"
                  replace: 'WARN'
              - labels:
                  level: null
              - metrics:
                  fmop_logs_by_level:
                    type: Counter
                    description: "The number of logs lines by level"
                    source: level
                    max_idle_duration: 30m
                    config:
                      match_all: true
                      action: inc
              - match:
                  selector: '{product=~"fmop|maxen|voip",language=~"java|quarkus"} |~ "[a-zA-Z$0-9]+Exception"'
                  stages:
                  - json:
                      expressions:
                        exception: exception
                  - regex:
                      expression: "(?P<exception_name>[a-zA-Z$0-9]+Exception)"
                      source: exception
                  - labels:
                      exception_name: null
                  - metrics:
                      fmop_logs_by_exception_java:
                        type: Counter
                        description: "The number of logs lines by exception"
                        source: exception_name
                        max_idle_duration: 30m
                        config:
                          match_all: true
                          action: inc
      extraRelabelConfigs:
        - action: labelmap
          regex: __meta_kubernetes_pod_label_leap_expert_(.+)
    clients:
      - url: http://observability-loki:3100/loki/api/v1/push
  serviceMonitor:
    enabled: true
    labels:
      observability: prometheus-operator
